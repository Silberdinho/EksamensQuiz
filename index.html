<!-- =====================================================================
     APP LOGIC (design + behaviour). No course content below this line.
     ===================================================================== -->
<script>
(function(){
  "use strict";
  const STORE_KEY = "skoleExam.v1";
  const TYPE_LABEL = { mc:"Multiple choice", def:"Definition", case:"Scenario", tf:"True / false", calc:"Calculation", essay:"Essay", td:"Term → definition", dt:"Definition → term", card:"Term card" };
  const app = document.getElementById("app");

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  function hash(str){ let h = 5381; for (let i=0;i<str.length;i++) h = ((h<<5)+h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
  function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  const slug = code => code.toLowerCase();

  // give every question a stable id + course reference
  COURSES.forEach(c => (c.questions||[]).forEach(q => { q.id = c.code + "-" + q.t + "-" + hash(q.q); q.course = c.code; }));
  const courseBy = code => COURSES.find(c => slug(c.code) === slug(code));
  const topicOf = (c, id) => c.topics.find(t => t.id === id);

  // terms: flatten each course's TERMS block; every term gets a stable id
  COURSES.forEach(c => { c.terms = []; });
  (typeof TERMS !== "undefined" ? TERMS : []).forEach(b => {
    const c = courseBy(b.code); if (!c) return;
    b.chapters.forEach(ch => ch.terms.forEach(tm => c.terms.push(Object.assign({}, tm, { t: ch.t, id: "T-" + c.code + "-" + ch.t + "-" + hash(tm.n), course: "T:" + c.code }))));
  });
  const termsOf = (c, tid) => c.terms.filter(tm => tm.t === tid);

  /* ---------- storage (per browser) ---------- */
  let store = { ans:{}, miss:{}, shuffle:true };
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e){}
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }
  function record(q, correct){
    const prev = store.ans[q.id] || { n:0 };
    store.ans[q.id] = { c: correct ? 1 : 0, n: prev.n + 1 };
    const list = store.miss[q.course] || (store.miss[q.course] = []);
    const i = list.indexOf(q.id);
    if (!correct && i < 0) list.push(q.id);
    if (correct && i >= 0) list.splice(i, 1);
    save();
  }
  function stats(qs){
    let answered=0, correct=0;
    qs.forEach(q => { const a = store.ans[q.id]; if (a){ answered++; if (a.c) correct++; } });
    return { total: qs.length, answered, correct };
  }
  function mistakes(c){ const ids = store.miss[c.code] || []; return c.questions.filter(q => ids.includes(q.id)); }
  function termMistakes(c){ const ids = store.miss["T:" + c.code] || []; return c.terms.filter(tm => ids.includes(tm.id)); }

  /* ---------- backup (export / import) ---------- */
  let backupMsg = "", backupOk = true, showCode = false;
  function backupText(){ return JSON.stringify({ app:"eksamensquiz", version:1, saved:new Date().toISOString(), progress:store }); }
  function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function restore(text){
    try {
      const d = JSON.parse(String(text).trim());
      const p = d && d.progress ? d.progress : d;
      if (!p || typeof p.ans !== "object" || typeof p.miss !== "object") throw new Error("format");
      store = Object.assign({ ans:{}, miss:{}, shuffle:true }, p); save();
      const n = Object.keys(store.ans).length;
      backupOk = true; backupMsg = `Progress restored: ${n} answered question${n===1?"":"s"}` + (d.saved ? ` (backup from ${new Date(d.saved).toLocaleDateString("en-GB")}).` : ".");
    } catch(e){
      backupOk = false; backupMsg = "That is not a backup from this site. Make sure you chose the right file or pasted the whole code.";
    }
    showCode = false; render();
  }
  // Inside the Claude viewer, files are saved through its "downloads" capability;
  // anywhere else (GitHub Pages, local file) a normal browser download is used.
  const inClaude = !!(window.claude && typeof window.claude.use === "function");
  let downloads = null;
  if (inClaude) window.claude.use("downloads").then(d => { downloads = d; }, () => {});
  function downloadBackup(){
    const filename = `eksamensquiz-backup-${today()}.json`;
    if (inClaude){
      if (!downloads){ backupOk = false; backupMsg = "Downloading is not available here. Use “Copy backup code” instead."; render(); return; }
      downloads.save({ filename, data: backupText() }).then(
        () => { backupOk = true; backupMsg = "Backup file saved. Keep it somewhere safe, e.g. your Downloads folder or cloud storage."; render(); },
        err => { const code = err && err.code;
          backupOk = false;
          backupMsg = code === "declined" ? "Download cancelled. Nothing was saved."
            : code === "rate_limited" ? "A save prompt is already open. Finish it, then try again."
            : "Downloading is not available here. Use “Copy backup code” instead.";
          render(); });
      return;
    }
    try {
      const blob = new Blob([backupText()], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      backupOk = true; backupMsg = "Backup file saved to your Downloads folder. If no file appeared, use “Copy backup code” instead.";
    } catch(e){ backupOk = false; backupMsg = "The download was blocked here. Use “Copy backup code” instead."; }
    render();
  }
  function copyBackup(){
    const txt = backupText();
    const fail = () => { showCode = true; backupOk = false; backupMsg = "Copying was blocked. Select the code in the box below and copy it yourself."; render();
      const out = document.getElementById("backup-out"); if (out){ out.focus(); out.select(); } };
    if (!navigator.clipboard || !navigator.clipboard.writeText) return fail();
    navigator.clipboard.writeText(txt).then(() => { showCode = false; backupOk = true; backupMsg = "Backup code copied. Paste it somewhere safe, for example a note or an email to yourself."; render(); }, fail);
  }
  function backupSection(){
    const n = Object.keys(store.ans).length;
    return `<section class="card backup">
      <h2>Back up your progress</h2>
      <p class="note">Your progress (${n} answered question${n===1?"":"s"}) is saved in this browser. Save a backup to keep it safe or to move it to another browser or device.</p>
      <div class="btnrow"><button class="btn" data-backup="download">Download backup file</button><button class="btn alt" data-backup="copy">Copy backup code</button></div>
      ${showCode ? `<label class="note" for="backup-out">Your backup code:</label><textarea id="backup-out" readonly>${esc(backupText())}</textarea>` : ""}
      <h3>Restore a backup</h3>
      <p class="note">Restoring replaces the progress in this browser.</p>
      <div class="btnrow"><button class="btn alt" data-backup="file">Choose backup file</button></div>
      <input type="file" id="backup-file" accept=".json,application/json,text/plain" hidden>
      <label class="note" for="backup-code">Or paste a backup code:</label>
      <textarea id="backup-code" placeholder='{"app":"eksamensquiz", …}'></textarea>
      <div class="btnrow"><button class="btn alt" data-backup="paste">Restore from code</button></div>
      ${backupMsg ? `<div class="feedback ${backupOk?"ok":"bad"}" role="status"><p>${esc(backupMsg)}</p></div>` : ""}
    </section>`;
  }

  /* ---------- dates ---------- */
  function daysLeft(iso){
    const [y,m,d] = iso.split("-").map(Number);
    const exam = new Date(y, m-1, d); const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((exam - today) / 86400000);
  }
  function fmtDate(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-GB",{ weekday:"short", day:"numeric", month:"short", year:"numeric" }); }
  function countdown(iso){
    const n = daysLeft(iso);
    if (n > 1) return `<div class="countdown"><b>${n}</b><span class="muted">days left</span></div>`;
    if (n === 1) return `<div class="countdown"><b>1</b><span class="muted">day left</span></div>`;
    if (n === 0) return `<div class="countdown"><b>Today</b></div>`;
    return `<div class="countdown"><span class="muted">Exam was ${-n} days ago</span></div>`;
  }

  /* ---------- shared pieces ---------- */
  function bar(s){
    const ok = s.total ? s.correct/s.total*100 : 0, bad = s.total ? (s.answered-s.correct)/s.total*100 : 0;
    return `<div class="bar" role="img" aria-label="${s.correct} correct, ${s.answered-s.correct} wrong, of ${s.total}"><i class="ok" style="width:${ok}%"></i><i class="bad" style="width:${bad}%"></i></div>`;
  }
  function statLine(s){
    const pct = s.answered ? Math.round(s.correct/s.answered*100) : 0;
    return `<p class="stat">${s.answered}/${s.total} answered${s.answered ? ` · ${pct}% correct last time` : ""}</p>`;
  }
  function nav(crumbs, backTo){
    const parts = crumbs.map((c,i) => i < crumbs.length-1 ? `<a href="#${c.h}">${esc(c.label)}</a><span class="sep">›</span>` : `<span aria-current="page">${esc(c.label)}</span>`).join("");
    const back = backTo === null ? "" : `<button class="back" data-go="${backTo}" aria-label="Back">← Back</button>`;
    return `<div class="topbar">${back}<nav class="crumbs" aria-label="Breadcrumb">${parts}</nav></div>`;
  }
  function setTheme(color){ app.className = color ? "c-" + color : "c-teal"; document.body.className = app.className; }

  /* ---------- state ---------- */
  let session = null;     // active quiz / flashcard round
  let confirmReset = false;

  function go(h){ if (location.hash === "#" + h || (!h && !location.hash)) { session = null; render(); } else location.hash = h; }
  window.addEventListener("hashchange", () => { session = null; confirmReset = false; render(); });

  /* ---------- HOME ---------- */
  function renderHome(){
    setTheme("teal");
    const active = COURSES.filter(c => c.status !== "soon").sort((a,b) => a.exam.localeCompare(b.exam));
    const next = active.find(c => daysLeft(c.exam) >= 0);
    const cards = COURSES.map(c => {
      if (c.status === "soon") return `<div class="card course-card soon c-${c.color||"slate"}"><span class="code">${esc(c.code)}</span><h3>${esc(c.name)}</h3><span class="pill ghost">Coming soon</span><p class="note">Questions will be added from a separate chat.</p></div>`;
      const s = stats(c.questions);
      return `<button class="card course-card c-${c.color}" data-go="${slug(c.code)}">
        <span class="code">${esc(c.code)}</span><h3>${esc(c.name)}</h3>
        <p class="stat">Exam ${esc(fmtDate(c.exam))}</p>${countdown(c.exam)}${bar(s)}${statLine(s)}${c.terms.length ? `<p class="stat">+ ${c.terms.length} key terms in the Terms quiz</p>` : ""}</button>`;
    }).join("");
    const total = active.reduce((n,c)=>n+c.questions.length,0);
    app.innerHTML = `
      ${nav([{label:"Home",h:""}], null)}
      <header class="hero"><span class="eyebrow">Information Security · NTNU · Autumn 2026</span>
        <h1>Skole Exam Trainer</h1>
        <p class="muted">${total} questions from former exams, slides and notes. ${next ? `Next up: <b>${esc(next.code)}</b> on ${esc(fmtDate(next.exam))}.` : ""}</p></header>
      <section class="grid">${cards}</section>
      ${backupSection()}
      <footer>Progress is saved in this browser. Keep a backup to be safe. ⭐ = based on a former exam question.</footer>`;
  }

  /* ---------- COURSE ---------- */
  function modeBlock(title, desc, qs, scope){
    const n = qs.length;
    return `<div class="mode"><h3>${esc(title)}</h3><p class="note">${esc(desc)} · ${n} question${n===1?"":"s"}</p>
      <div class="btnrow"><button class="btn" data-start="quiz" data-scope="${scope}" ${n?"":"disabled"}>Quiz</button>
      <button class="btn alt" data-start="flash" data-scope="${scope}" ${n?"":"disabled"}>Flashcards</button></div></div>`;
  }
  function shuffleToggle(){ return `<label class="toggle"><input type="checkbox" id="shuffle-toggle" ${store.shuffle?"checked":""}> Shuffle questions</label>`; }

  function renderCourse(c){
    setTheme(c.color);
    const s = stats(c.questions);
    const examQs = c.questions.filter(q => q.x), miss = mistakes(c);
    const topics = c.topics.map((t,i) => {
      const qs = c.questions.filter(q => q.t === t.id), ts = stats(qs), stars = qs.filter(q=>q.x).length;
      return `<button class="card topic-card" data-go="${slug(c.code)}-${t.id}">
        <span class="num">${esc(t.label || "Lecture " + (i+1))}</span><h3>${esc(t.title)}</h3><span class="file">Slides: ${esc(t.file)}</span>
        <div class="btnrow"><span class="pill">${qs.length} questions</span>${stars?`<span class="pill star">⭐ ${stars} from exams</span>`:""}</div>
        ${bar(ts)}${statLine(ts)}</button>`;
    }).join("");
    app.innerHTML = `
      ${nav([{label:"Home",h:""},{label:c.code,h:slug(c.code)}], "")}
      <header class="hero"><span class="eyebrow">${esc(c.code)} · ${esc(c.examInfo)}</span><h1>${esc(c.name)}</h1>
        <p class="muted">Exam ${esc(fmtDate(c.exam))}</p>${countdown(c.exam)}${bar(s)}${statLine(s)}</header>
        ${jumpLinks(c)}
      ${shuffleToggle()}
      <section class="section" id="topic-quiz"><span class="eyebrow">Section 1</span><h2>Topic quiz</h2>
        <p class="note">Exam-style questions per lecture: multiple choice, scenarios, calculations and essays.</p>
      <section class="modes">
        ${modeBlock("All topics","Everything in this course", c.questions, "all")}
        ${modeBlock("Former exam questions only","Questions marked ⭐", examQs, "exam")}
        ${modeBlock("Practice my mistakes","Questions you got wrong last time", miss, "miss")}
      </section>
      <h3>Topics</h3><section class="grid">${topics}</section></section>
      ${termsSection(c)}
      <div class="confirm">${confirmReset
        ? `<span>Delete all saved answers and mistakes for ${esc(c.code)} (topic quiz and terms quiz)?</span><button class="btn" data-reset="yes">Yes, reset</button><button class="btn alt" data-reset="no">Cancel</button>`
        : `<button class="btn alt" data-reset="ask">Reset progress for ${esc(c.code)}</button>`}</div>`;
  }

  /* ---------- TERMS QUIZ (course section + chapter page) ---------- */
  function jumpLinks(c){
    if (!c.terms.length) return "";
    return `<nav class="jump" aria-label="Sections"><button class="btn alt" data-jump="topic-quiz">Topic quiz</button><button class="btn alt" data-jump="terms-quiz">Terms quiz</button></nav>`;
  }
  function termBlock(title, desc, items, scope){
    const n = items.length, dis = n ? "" : "disabled";
    return `<div class="mode"><h3>${esc(title)}</h3><p class="note">${esc(desc)} · ${n} term${n===1?"":"s"}</p>
      <div class="btnrow"><button class="btn" data-tstart="td" data-tscope="${scope}" ${dis}>Term → definition</button>
      <button class="btn" data-tstart="dt" data-tscope="${scope}" ${dis}>Definition → term</button>
      <button class="btn alt" data-tstart="card" data-tscope="${scope}" ${dis}>Flashcards</button></div></div>`;
  }
  function termsSection(c){
    if (!c.terms.length) return "";
    const chapters = c.topics.map((t,i) => {
      const items = termsOf(c, t.id); if (!items.length) return "";
      const s = stats(items), stars = items.filter(tm => tm.x).length;
      return `<button class="card topic-card" data-go="${slug(c.code)}-terms-${t.id}">
        <span class="num">${esc(t.label || "Lecture " + (i+1))}</span><h3>${esc(t.title)}</h3>
        <div class="btnrow"><span class="pill">${items.length} terms</span>${stars?`<span class="pill star">⭐ ${stars} from exams</span>`:""}</div>
        ${bar(s)}${statLine(s)}</button>`;
    }).join("");
    const s = stats(c.terms);
    return `<section class="section" id="terms-quiz"><span class="eyebrow">Section 2</span><h2>Terms quiz</h2>
      <p class="note">${c.terms.length} key terms, chapter by chapter in lecture order. Wrong options are always other terms from the same chapter.</p>
      ${bar(s)}${statLine(s)}
      <section class="modes">
        ${termBlock("All chapters","Every term in this course", c.terms, "all")}
        ${termBlock("Former exam terms only","Terms marked ⭐", c.terms.filter(tm => tm.x), "exam")}
        ${termBlock("Practice my mistakes","Terms you got wrong last time", termMistakes(c), "miss")}
      </section>
      <h3>Chapters</h3><section class="grid">${chapters}</section></section>`;
  }
  function renderTermChapter(c, t){
    setTheme(c.color);
    const items = termsOf(c, t.id), s = stats(items), idx = c.topics.indexOf(t);
    const miss = termMistakes(c).filter(tm => tm.t === t.id);
    const list = items.map(tm => `<div><dt>${esc(tm.n)}${tm.x?` <span class="pill star">⭐ ${esc(tm.x)}</span>`:""}${tm.chk?` <span class="pill chk">Needs checking</span>`:""}</dt>
      <dd>${esc(tm.d)}${tm.ex?`<br><i>Example:</i> ${esc(tm.ex)}`:""}</dd></div>`).join("");
    app.innerHTML = `
      ${nav([{label:"Home",h:""},{label:c.code,h:slug(c.code)},{label:"Terms · " + t.title,h:slug(c.code)+"-terms-"+t.id}], slug(c.code))}
      <header class="hero"><span class="eyebrow">${esc(c.code)} · Terms quiz · ${esc(t.label || "Lecture " + (idx+1))}</span><h1>${esc(t.title)}</h1>
        <p class="muted">${items.length} key terms</p>${bar(s)}${statLine(s)}</header>
      <section class="modes">
        ${termBlock("Whole chapter","All terms in this chapter", items, "ch")}
        ${termBlock("Former exam terms","Only ⭐ terms in this chapter", items.filter(tm => tm.x), "chexam")}
        ${termBlock("My mistakes in this chapter","Wrong last time", miss, "chmiss")}
      </section>
      ${shuffleToggle()}
      <details class="glossary"><summary>Show all ${items.length} terms with definitions</summary><dl>${list}</dl></details>`;
  }

  /* ---------- TOPIC ---------- */
  function renderTopic(c, t){
    setTheme(c.color);
    const qs = c.questions.filter(q => q.t === t.id), s = stats(qs);
    const examQs = qs.filter(q=>q.x), miss = mistakes(c).filter(q=>q.t===t.id);
    const idx = c.topics.indexOf(t);
    const kinds = Object.entries(qs.reduce((m,q)=>{ m[q.k]=(m[q.k]||0)+1; return m; },{})).map(([k,n])=>`<span class="pill ghost">${n} ${TYPE_LABEL[k].toLowerCase()}</span>`).join("");
    app.innerHTML = `
      ${nav([{label:"Home",h:""},{label:c.code,h:slug(c.code)},{label:t.title,h:slug(c.code)+"-"+t.id}], slug(c.code))}
      <header class="hero"><span class="eyebrow">${esc(c.code)} · ${esc(t.label || "Lecture " + (idx+1))}</span><h1>${esc(t.title)}</h1>
        <p class="muted">Slides: ${esc(t.file)}</p><div class="btnrow">${kinds}</div>${bar(s)}${statLine(s)}</header>
      <section class="modes">
        ${modeBlock("Whole topic","All questions in this topic", qs, "topic")}
        ${modeBlock("Former exam questions","Only ⭐ questions in this topic", examQs, "topicexam")}
        ${modeBlock("My mistakes in this topic","Wrong last time", miss, "topicmiss")}
      </section>
      ${shuffleToggle()}`;
    app.dataset.topic = t.id;
  }

  /* ---------- SESSION start ---------- */
  function startSession(c, t, mode, scope){
    let qs, label;
    if (scope === "all"){ qs = c.questions; label = "All topics"; }
    else if (scope === "exam"){ qs = c.questions.filter(q=>q.x); label = "Former exam questions"; }
    else if (scope === "miss"){ qs = mistakes(c); label = "My mistakes"; }
    else if (scope === "topic"){ qs = c.questions.filter(q=>q.t===t.id); label = t.title; }
    else if (scope === "topicexam"){ qs = c.questions.filter(q=>q.t===t.id && q.x); label = t.title + " · exam"; }
    else { qs = mistakes(c).filter(q=>q.t===t.id); label = t.title + " · mistakes"; }
    if (!qs.length) return;
    const list = store.shuffle ? shuffle(qs) : qs.slice();
    session = { code:c.code, topic: t ? t.id : null, mode, scope, label, list, i:0, results:[], done:false };
    prepQuestion(); render(); window.scrollTo(0,0);
  }
  function startTermSession(c, t, dir, scope){
    let items, label;
    const all = c.terms, ch = t ? termsOf(c, t.id) : [];
    if (scope === "all"){ items = all; label = "Terms · all chapters"; }
    else if (scope === "exam"){ items = all.filter(tm => tm.x); label = "Terms · former exams"; }
    else if (scope === "miss"){ items = termMistakes(c); label = "Terms · my mistakes"; }
    else if (scope === "ch"){ items = ch; label = "Terms · " + t.title; }
    else if (scope === "chexam"){ items = ch.filter(tm => tm.x); label = "Terms · " + t.title + " · exam"; }
    else { items = termMistakes(c).filter(tm => t && tm.t === t.id); label = "Terms · " + (t ? t.title : "") + " · mistakes"; }
    if (!items.length) return;
    const list = store.shuffle ? shuffle(items) : items.slice();
    session = { code:c.code, topic: t ? t.id : null, terms:true, dir, mode: dir === "card" ? "flash" : "quiz", scope, label, list, i:0, results:[], done:false };
    prepQuestion(); render(); window.scrollTo(0,0);
  }
  // builds a question from a term; wrong options are other real terms from the same chapter
  function termQuestion(c, tm, dir){
    const base = { id: tm.id, course: tm.course, t: tm.t, x: tm.x, chk: tm.chk, term: true };
    const ex = tm.ex ? "Example: " + tm.ex : "";
    if (dir === "card") return Object.assign(base, { k:"card", q: tm.n, o:[tm.d], a:0, e: ex });
    let pool = termsOf(c, tm.t).filter(o => o.id !== tm.id && o.n !== tm.n && o.d !== tm.d);
    const opts = shuffle([tm].concat(shuffle(pool).slice(0, 3)));
    const a = opts.indexOf(tm);
    if (dir === "td") return Object.assign(base, { k:"td", q: `What does “${tm.n}” mean?`, o: opts.map(o => o.d), a, e: ex });
    return Object.assign(base, { k:"dt", q: `Which term matches this definition? “${tm.d}”`, o: opts.map(o => o.n), a, e: ex ? tm.n + ". " + ex : "" });
  }
  const curQ = () => session.terms ? session.cur : session.list[session.i];
  function prepQuestion(){
    if (session.terms){
      const item = session.list[session.i];
      session.answered = false; session.chosen = null; session.flipped = false; session.revealed = false; session.draft = "";
      session.cur = item ? termQuestion(courseBy(session.code), item, session.dir) : null;
      session.order = session.cur ? session.cur.o.map((_,i)=>i) : [];
      return;
    }
    const q = session.list[session.i];
    session.answered = false; session.chosen = null; session.flipped = false; session.revealed = false; session.draft = "";
    if (!q || !q.o) { session.order = []; return; }
    const idx = q.o.map((_,i)=>i);
    const fixed = q.k === "tf" || q.o.some(o => /of the above|other options/i.test(o));
    session.order = (store.shuffle && !fixed) ? shuffle(idx) : idx;
  }

  /* ---------- QUIZ / FLASH render ---------- */
  function qMeta(c, q){
    const t = topicOf(c, q.t);
    return `<div class="qmeta"><span class="pill">${q.term ? "Terms · " : ""}${esc(t ? t.title : q.t)}</span><span class="pill ghost">${TYPE_LABEL[q.k]}</span>
      ${q.x ? `<span class="pill star">⭐ ${esc(q.x)}</span>` : ""}${q.chk ? `<span class="pill chk">Needs checking</span>` : ""}</div>`;
  }
  function sessionNav(c){
    const crumbs = [{label:"Home",h:""},{label:c.code,h:slug(c.code)}];
    if (session.topic){ const t = topicOf(c, session.topic);
      crumbs.push(session.terms ? {label:"Terms · " + t.title,h:slug(c.code)+"-terms-"+t.id} : {label:t.title,h:slug(c.code)+"-"+t.id}); }
    else if (session.terms) crumbs.push({label:"Terms quiz",h:slug(c.code)});
    crumbs.push({label: session.mode === "quiz" ? "Quiz" : "Flashcards", h: location.hash.slice(1)});
    return nav(crumbs, location.hash.slice(1) || "");
  }
  function progress(){
    const n = session.list.length, i = Math.min(session.i+1, n);
    return `<div class="progress"><span>${esc(session.label)}</span><div class="bar"><i style="width:${(session.i)/n*100}%"></i></div><span>${i}/${n}</span></div>`;
  }

  function renderQuiz(c){
    const q = curQ();
    let body = "";
    if (q.k === "essay"){
      body = `<label class="note" for="essay-draft">Write your key points (optional, not saved):</label>
        <textarea id="essay-draft" placeholder="Outline your answer here…">${esc(session.draft)}</textarea>`;
      if (!session.revealed) body += `<div class="btnrow"><button class="btn" data-act="reveal">Show model answer</button></div>`;
      else {
        body += `<div class="feedback neutral"><strong>Key points to include</strong><ul class="kp">${q.kp.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
          <div class="model"><strong>Model answer</strong><p>${esc(q.m)}</p></div>`;
        body += session.answered ? `<div class="btnrow"><button class="btn" data-act="next">${session.i+1 < session.list.length ? "Next question →" : "See score"}</button></div>`
          : `<p class="note">Compare with your outline. Did you cover the key points?</p><div class="btnrow"><button class="btn" data-self="1">I covered them</button><button class="btn alt" data-self="0">I missed some</button></div>`;
      }
    } else {
      const opts = session.order.map((oi, pos) => {
        let cls = "opt";
        if (session.answered){ if (oi === q.a) cls += " right"; else if (oi === session.chosen) cls += " wrong"; }
        return `<button class="${cls}" data-opt="${oi}" ${session.answered?"disabled":""}><span class="key">${pos+1}</span><span>${esc(q.o[oi])}</span></button>`;
      }).join("");
      body = `<div class="opts" role="group" aria-label="Answer options">${opts}</div>`;
      if (session.answered){
        const ok = session.chosen === q.a;
        body += `<div class="feedback ${ok?"ok":"bad"}"><strong>${ok?"Correct":"Not quite"}</strong>
          ${ok?"":`<p>Correct answer: <b>${esc(q.o[q.a])}</b></p>`}${q.e ? `<p>${esc(q.e)}</p>` : ""}
          ${q.chk?`<p class="note">This answer is marked “Needs checking”: confirm it with the slides or lecturer.</p>`:""}</div>
          <div class="btnrow"><button class="btn" data-act="next">${session.i+1 < session.list.length ? "Next question →" : "See score"}</button></div>`;
      } else body += `<p class="note">Tip: press 1–${q.o.length} on a keyboard.</p>`;
    }
    app.innerHTML = `${sessionNav(c)}${progress()}<article class="qcard">${qMeta(c,q)}<p class="qtext">${esc(q.q)}</p>${body}</article>`;
  }

  function renderFlash(c){
    const q = curQ();
    let back = "";
    if (q.k === "essay") back = `<strong>Key points</strong><ul class="kp">${q.kp.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`;
    else back = `${q.k==="card"?`<p class="term-front">${esc(q.q)}</p>`:""}<p class="qtext">${esc(q.o[q.a])}</p>${q.e?`<p class="muted">${esc(q.e)}</p>`:""}
      ${q.chk?`<p class="note">Marked “Needs checking”: confirm it with the slides or lecturer.</p>`:""}`;
    const card = session.flipped
      ? `<button class="qcard flash" data-act="flip" aria-label="Show question"><span class="side">Answer</span>${back}</button>`
      : `<button class="qcard flash" data-act="flip" aria-label="Show answer"><span class="side">${q.k==="card"?"Term":"Question"} · tap to flip</span>${qMeta(c,q)}<p class="${q.k==="card"?"term-front":"qtext"}">${esc(q.q)}</p></button>`;
    const actions = session.flipped
      ? `<div class="btnrow"><button class="btn" data-know="1">I knew it</button><button class="btn alt" data-know="0">I didn't know</button></div>`
      : `<div class="btnrow"><button class="btn" data-act="flip">Show answer</button>${session.i>0?`<button class="btn alt" data-act="prev">← Previous</button>`:""}</div>`;
    app.innerHTML = `${sessionNav(c)}${progress()}${card}${actions}`;
  }

  function renderResult(c){
    const n = session.results.length, ok = session.results.filter(r=>r.ok).length;
    const wrong = session.results.filter(r=>!r.ok);
    const pct = n ? Math.round(ok/n*100) : 0;
    const verdict = pct >= 90 ? "Excellent. You are exam-ready on this set." : pct >= 70 ? "Good. Review the ones you missed." : pct >= 50 ? "Getting there. Practise your mistakes next." : "Keep going. Use flashcards, then quiz again.";
    const list = wrong.length ? wrong.map(r => {
      const q = r.q, t = topicOf(c,q.t);
      const ans = q.k === "essay" ? "See key points in the model answer" : q.o[q.a];
      if (q.term){ const tm = c.terms.find(x => x.id === q.id) || {};
        return `<div class="rev"><span class="note">${esc(t?t.title:"")}${q.x?` · ⭐ ${esc(q.x)}`:""}</span><span><b>${esc(tm.n)}</b></span><span class="ans">${esc(tm.d)}</span></div>`; }
      return `<div class="rev"><span class="note">${esc(t?t.title:"")}${q.x?` · ⭐ ${esc(q.x)}`:""}</span><span>${esc(q.q)}</span><span class="ans">${esc(ans)}</span></div>`;
    }).join("") : `<div class="empty">No mistakes this round.</div>`;
    const missCount = session.terms ? termMistakes(c).filter(tm => !session.topic || tm.t === session.topic).length : mistakes(c).length;
    const missBtn = session.terms
      ? `<button class="btn alt" data-tstart="${session.dir}" data-tscope="${session.topic ? "chmiss" : "miss"}" ${missCount?"":"disabled"}>Practice my mistakes (${missCount})</button>`
      : `<button class="btn alt" data-start="${session.mode}" data-scope="miss" ${missCount?"":"disabled"}>Practice my mistakes (${missCount})</button>`;
    app.innerHTML = `${sessionNav(c)}
      <section class="card"><span class="eyebrow">${esc(session.label)} · ${session.mode==="quiz"?"Quiz":"Flashcards"} finished</span>
        <div class="countdown"><span class="score">${ok}/${n}</span><span class="muted">${pct}%</span></div><p>${verdict}</p>
        <div class="btnrow"><button class="btn" data-act="again">Try this set again</button>
        ${missBtn}
        <button class="btn alt" data-go="${location.hash.slice(1)}">Done</button></div></section>
      <h2>Review: answers you missed</h2><div class="list">${list}</div>`;
  }

  /* ---------- router ---------- */
  function render(){
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (!h){ renderHome(); return; }
    const [code, topicId] = h.split(/-(.+)/);
    const c = courseBy(code);
    if (!c || c.status === "soon"){ renderHome(); return; }
    if (session && session.code === c.code){
      if (session.done) return renderResult(c);
      return session.mode === "quiz" ? renderQuiz(c) : renderFlash(c);
    }
    if (topicId && topicId.startsWith("terms-")){ const tt = topicOf(c, topicId.slice(6));
      return tt && termsOf(c, tt.id).length ? renderTermChapter(c, tt) : renderCourse(c); }
    const t = topicId ? topicOf(c, topicId) : null;
    if (topicId && !t) return renderCourse(c);
    t ? renderTopic(c, t) : renderCourse(c);
  }

  function currentCourse(){ const h = location.hash.slice(1).toLowerCase(); let [code, tid] = h.split(/-(.+)/); const c = courseBy(code);
    if (tid && tid.startsWith("terms-")) tid = tid.slice(6);
    return { c, t: c && tid ? topicOf(c, tid) : null }; }
  function advance(){
    session.i++;
    if (session.i >= session.list.length){ session.done = true; }
    else prepQuestion();
    render(); window.scrollTo(0,0);
  }
  function answer(oi){
    const q = curQ(); if (session.answered) return;
    session.answered = true; session.chosen = oi;
    const ok = oi === q.a; record(q, ok); session.results.push({ q, ok }); render();
  }

  /* ---------- events ---------- */
  app.addEventListener("click", e => {
    const el = e.target.closest("button, a"); if (!el) return;
    const d = el.dataset;
    if (d.go !== undefined){ e.preventDefault(); go(d.go); return; }
    if (d.backup){
      if (d.backup === "download") downloadBackup();
      else if (d.backup === "copy") copyBackup();
      else if (d.backup === "file") document.getElementById("backup-file").click();
      else if (d.backup === "paste"){ const v = document.getElementById("backup-code").value;
        if (!v.trim()){ backupOk = false; backupMsg = "Paste a backup code into the box first."; render(); } else restore(v); }
      return;
    }
    if (d.jump){ const el2 = document.getElementById(d.jump); if (el2) el2.scrollIntoView({ behavior:"smooth", block:"start" }); return; }
    const { c, t } = currentCourse();
    if (d.tstart){ const dir = d.tstart, scope = d.tscope; session = null; startTermSession(c, t, dir, scope); return; }
    if (d.start){
      // from a result screen, "miss" means mistakes in the same scope (topic or course)
      let scope = d.scope;
      if (session && session.topic && scope === "miss") scope = "topicmiss";
      session = null; startSession(c, t, d.start, scope); return;
    }
    if (d.reset){ if (d.reset === "ask") confirmReset = true; else { if (d.reset === "yes"){ c.questions.forEach(q => delete store.ans[q.id]); c.terms.forEach(tm => delete store.ans[tm.id]); delete store.miss[c.code]; delete store.miss["T:" + c.code]; save(); } confirmReset = false; } render(); return; }
    if (!session) return;
    if (d.opt !== undefined){ answer(Number(d.opt)); return; }
    if (d.act === "next"){ advance(); return; }
    if (d.act === "reveal"){ const ta = document.getElementById("essay-draft"); if (ta) session.draft = ta.value; session.revealed = true; render(); return; }
    if (d.self !== undefined){ const ta = document.getElementById("essay-draft"); if (ta) session.draft = ta.value;
      const q = curQ(), ok = d.self === "1"; record(q, ok); session.results.push({ q, ok }); session.answered = true; render(); return; }
    if (d.act === "flip"){ session.flipped = !session.flipped; render(); return; }
    if (d.act === "prev"){ if (session.i > 0){ session.i--; session.results.pop(); prepQuestion(); render(); } return; }
    if (d.know !== undefined){ const q = curQ(), ok = d.know === "1"; record(q, ok); session.results.push({ q, ok }); advance(); return; }
    if (d.act === "again"){ const list = store.shuffle ? shuffle(session.list) : session.list; Object.assign(session, { list, i:0, results:[], done:false }); prepQuestion(); render(); window.scrollTo(0,0); return; }
  });
  app.addEventListener("change", e => {
    if (e.target.id === "shuffle-toggle"){ store.shuffle = e.target.checked; save(); }
    if (e.target.id === "backup-file" && e.target.files[0]){
      const r = new FileReader();
      r.onload = () => restore(r.result);
      r.onerror = () => { backupOk = false; backupMsg = "Could not read that file. Try again or paste the code instead."; render(); };
      r.readAsText(e.target.files[0]);
    }
  });
  app.addEventListener("input", e => { if (e.target.id === "essay-draft" && session) session.draft = e.target.value; });
  document.addEventListener("keydown", e => {
    if (!session || session.done || session.mode !== "quiz" || e.target.tagName === "TEXTAREA") return;
    const q = curQ();
    if (!session.answered && q.o && /^[1-9]$/.test(e.key)){ const pos = Number(e.key)-1; if (pos < session.order.length) answer(session.order[pos]); }
    else if (session.answered && e.key === "Enter"){ e.preventDefault(); advance(); }
  });

  render();
})();
</script>
