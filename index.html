<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skole Exam Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single centred study column (max 880px); cards in an auto-fill grid; each course tints its pages with its own hue. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eceeea; --fg:#1b201d; --muted:#5c655f; --line:#d9ddd7;
  --ok:#1f7a45; --ok-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe7e5; --warn:#8a5a00; --warn-bg:#fff1d6;
  --teal:#0e6f68; --teal-soft:#dff0ee;
  --amber:#a8510a; --amber-soft:#fbeadb;
  --indigo:#3f46b8; --indigo-soft:#e6e7fa;
  --slate:#5f6b73; --slate-soft:#e7eaec;
  --c:var(--teal); --c-soft:var(--teal-soft);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --surface-2:#232a26; --fg:#e7ece8; --muted:#9aa59e; --line:#2f3833;
  --ok:#5fcf8b; --ok-bg:#163223; --bad:#ff8a80; --bad-bg:#3a1a18; --warn:#f1c063; --warn-bg:#352a12;
  --teal:#4fc7bc; --teal-soft:#153331; --amber:#f0a35c; --amber-soft:#3a2614;
  --indigo:#9ea4ff; --indigo-soft:#232650; --slate:#a7b2b9; --slate-soft:#262d31; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --surface-2:#232a26; --fg:#e7ece8; --muted:#9aa59e; --line:#2f3833;
  --ok:#5fcf8b; --ok-bg:#163223; --bad:#ff8a80; --bad-bg:#3a1a18; --warn:#f1c063; --warn-bg:#352a12;
  --teal:#4fc7bc; --teal-soft:#153331; --amber:#f0a35c; --amber-soft:#3a2614;
  --indigo:#9ea4ff; --indigo-soft:#232650; --slate:#a7b2b9; --slate-soft:#262d31; color-scheme:dark }
.c-teal{--c:var(--teal);--c-soft:var(--teal-soft)} .c-amber{--c:var(--amber);--c-soft:var(--amber-soft)}
.c-indigo{--c:var(--indigo);--c-soft:var(--indigo-soft)} .c-slate{--c:var(--slate);--c-soft:var(--slate-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
#app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700} h2{font-size:1.3rem;font-weight:700} h3{font-size:1.05rem;font-weight:700}
p{margin:0} .muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.9rem}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:.88rem;color:var(--muted);min-width:0}
.crumbs a{color:var(--c);text-decoration:none} .crumbs a:hover{text-decoration:underline}
.crumbs span.sep{opacity:.5}
.hero{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--fg);min-width:0}
button.card{transition:border-color .15s, transform .15s}
button.card:hover{border-color:var(--c);transform:translateY(-1px)}
.course-card{border-top:5px solid var(--c)}
.course-card .code{font-family:var(--f-mono);font-size:.85rem;color:var(--c)}
.countdown{display:flex;align-items:baseline;gap:6px}
.countdown b{font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .bad{background:var(--bad)}
.stat{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.soon{opacity:.75;border-style:dashed;border-top-style:solid}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--c-soft);color:var(--c);font-weight:600;white-space:nowrap}
.pill.star{background:var(--warn-bg);color:var(--warn)} .pill.chk{background:var(--bad-bg);color:var(--bad)}
.pill.ghost{background:var(--surface-2);color:var(--muted)}
.card > .pill{align-self:flex-start}
.topic-card .num{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.topic-card .file{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{background:var(--c-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--c);background:var(--c);color:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem}
.btn.alt{background:transparent;color:var(--c)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.toggle input{accent-color:var(--c);width:18px;height:18px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;border-left:5px solid var(--c)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qtext{font-size:1.1rem;font-weight:500;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:11px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .key{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)} .feedback.neutral{background:var(--surface-2)}
.feedback strong{font-family:var(--f-display)}
.progress{display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .bar{flex:1}
.progress .bar i{background:var(--c)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:10px;font:inherit;resize:vertical}
.kp{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.model{background:var(--surface-2);border-radius:10px;padding:14px;font-size:.95rem}
.flash{min-height:240px;cursor:pointer;justify-content:center}
.flash .side{font-size:.75rem;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--f-display);font-size:3rem;color:var(--c);line-height:1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.rev .ans{color:var(--ok);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.note{font-size:.85rem;color:var(--muted)}
footer{font-size:.8rem;color:var(--muted);text-align:center;padding-top:12px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

<!-- =====================================================================
     QUESTION DATA  (one block per course, separate from design and logic)
     Format of each course:
       code, name, exam (YYYY-MM-DD), examInfo, color (teal|amber|indigo|slate),
       status ("active" | "soon"), topics:[{id,title,file}], questions:[...]
     Format of each question:
       t   = topic id            k = "mc" | "def" | "case" | "tf" | "essay"
       q   = question text       o = options (not for essay)   a = index of correct option
       e   = short explanation   x = former exam tag (gives the ⭐ mark), optional
       chk = true → shown as "Needs checking"
       essay only: kp = key points to include, m = model answer
     To add a course: push one more object with the same format.
     ===================================================================== -->
<script>const COURSES = [];</script>
<script>
/* ================================================================
   COURSE: IMT4110 – Scientific Methodology and Communication
   Sources: former exam sets (Examples, Additional, Ord-23, SPSS, Lit),
   IMT4110 slides (9 decks), Eksamensnotater, Terminology notes.
   Exam tags: Ex-# = "Examples of exam questions", Add-# = "Additional
   examples", Ord-23 = ordinary exam 2023, SPSS/Lit = former exam tasks.
   ================================================================ */
COURSES.push({
  code: "IMT4110",
  name: "Scientific Methodology and Communication",
  exam: "2026-11-26",
  examInfo: "School exam · 4 h · no aids",
  color: "teal",
  status: "active",
  topics: [
    { id: "intro", title: "Introduction to research", file: "Introduction-short" },
    { id: "var", title: "Variables and operationalisation", file: "Variables and operationalisation" },
    { id: "cause", title: "Causality and third variables", file: "Causality and 3. variables" },
    { id: "relval", title: "Reliability and validity", file: "Reliability and Validity" },
    { id: "survey", title: "Surveys and representativity", file: "Surveys and the representativity of populations" },
    { id: "scales", title: "Scales of measurement", file: "Scales of measurements" },
    { id: "exp", title: "Experiments", file: "experiment_short" },
    { id: "hyp", title: "Hypothesis testing", file: "Hypothesis testing_short" },
    { id: "ethics", title: "Research ethics", file: "Ethics_short" }
  ],
  questions: [
    /* ---------- Introduction ---------- */
    { t:"intro", k:"mc", x:"Ex-4",
      q:"A master's student builds a password manager app. What turns this project into scientific research?",
      o:["The app uses modern encryption","The app is evaluated systematically with data to answer a clear research question, and the method is documented so others can replicate it","The app is published on an app store","The student writes a long user manual"],
      a:1, e:"Building a product is development. It becomes research when it answers a research question, is evaluated systematically with data, produces new knowledge and is documented for replication." },
    { t:"intro", k:"mc", x:"Add-1",
      q:"Why is the process of scientific inquiry described as cyclical (or helical)?",
      o:["Because every study must be repeated twice","Because the answer to one research problem usually reveals new problems and questions","Because data collection happens before the question is defined","Because the literature review is done at the end"],
      a:1, e:"Research starts with a question and ends by raising new questions, so the process loops back on itself." },
    { t:"intro", k:"def",
      q:"Which term matches: 'Based on observation or measured data, not only on opinion or logic'?",
      o:["Empirical","Deductive","Theoretical","Normative"], a:0,
      e:"Empirical research tests ideas against observations or data, for example a survey of 500 students." },
    { t:"intro", k:"mc", x:"Add-2",
      q:"According to Popper's falsifiability principle, what is true about a scientific hypothesis?",
      o:["It can be proven true with enough data","It must be possible to prove it wrong","It must come from inductive reasoning","It must be accepted by peer review first"],
      a:1, e:"We can never prove a hypothesis true, only fail to disprove it. One black swan disproves 'all swans are white'." },
    { t:"intro", k:"def",
      q:"Which term matches: 'Reasoning from a general theory to a specific, testable prediction (top-down)'?",
      o:["Inductive reasoning","Deductive reasoning","Abductive reasoning","Triangulation"], a:1,
      e:"Deduction goes from theory to prediction, for example 'stress lowers performance' → 'stressed students will score lower'. Induction goes from observations to a general conclusion." },
    { t:"intro", k:"mc",
      q:"Which research aim is described as 'seeking to understand experiences and the meaning people give them'?",
      o:["Empirical (positivist) research","Constructivist research","Advocacy research","Pragmatic research"], a:1,
      e:"Constructivism sees reality as built by people's experiences and meanings, and usually uses qualitative methods." },
    { t:"intro", k:"mc", x:"Lit (former exam)",
      q:"Why is a literature search important before you start a study?",
      o:["It replaces the need for data collection","It shows what is already known, avoids repeating old studies, and reveals useful methods and theory","It guarantees the hypothesis will be supported","It is only needed for qualitative studies"],
      a:1, e:"The literature review shows what is known and missing, prevents repeating work, and gives you methods, instruments and theory for hypotheses." },
    { t:"intro", k:"mc", x:"Add-6, Lit",
      q:"Which is the strongest quality indicator when judging a research article?",
      o:["It agrees with what you already believe","It is published in a peer-reviewed journal, follows IMRaD and reports its method and limitations clearly","It appears first on Google","It has many images"],
      a:1, e:"Peer review, a clear replicable method, honest limitations and a known publisher indicate quality. Agreeing with your view is confirmation bias." },
    { t:"intro", k:"def",
      q:"Which term matches: 'The standard structure of a research article: Introduction, Method, Results, and Discussion'?",
      o:["IMRaD","PICO","NOIR","APA"], a:0,
      e:"IMRaD is the standard article structure. Results present data without interpretation; the Discussion interprets them." },
    { t:"intro", k:"def",
      q:"Which term matches: 'Searching only for sources that support what you already believe'?",
      o:["Publication bias","Confirmation bias","Selection bias","Social desirability bias"], a:1,
      e:"Confirmation bias skews a literature search. Avoid it by also looking for counter-evidence." },

    /* ---------- Variables and operationalisation ---------- */
    { t:"var", k:"case",
      q:"Study: 'Does an information-security training course improve employees' ability to identify phishing emails?' What is the independent variable?",
      o:["The number of phishing emails identified correctly","Whether the employee received the training","The employees' age","The type of email client"], a:1,
      e:"The IV is the factor that may cause the change (training yes/no). The DV is the measured outcome (phishing emails identified)." },
    { t:"var", k:"def",
      q:"Which term matches: 'Turning an abstract concept into something specific that can be observed or measured'?",
      o:["Operationalisation","Triangulation","Randomisation","Generalisation"], a:0,
      e:"Example: 'security awareness' → percentage of phishing emails correctly identified in a short test." },
    { t:"var", k:"mc",
      q:"Which research question is best: clear, focused and empirically testable?",
      o:["Does technology affect people?","Is the internet good?","Does smartphone use during lectures lower exam scores among NTNU students?","What is the meaning of security?"], a:2,
      e:"A good research question names a relationship between measurable variables in a specific population." },
    { t:"var", k:"def",
      q:"Which variable explains HOW the independent variable affects the dependent variable (IV → ? → DV)?",
      o:["Moderating variable","Mediating variable","Confounding variable","Control variable"], a:1,
      e:"A mediator sits between IV and DV, e.g. phone use → less attention → lower score. A moderator changes the strength of the relationship." },
    { t:"var", k:"def",
      q:"Phone use hurts exam scores more for first-year students than for master's students. Year of study is a…",
      o:["Mediating variable","Moderating variable","Dependent variable","Third variable"], a:1,
      e:"A moderator changes the strength or direction of the IV–DV relationship." },
    { t:"var", k:"mc",
      q:"What is the difference between delimitations and limitations of a study?",
      o:["They mean the same thing","Delimitations are what the study deliberately does not cover; limitations are weaknesses the researcher could not avoid","Limitations are chosen by the researcher; delimitations are caused by bad luck","Delimitations are only used in qualitative research"], a:1,
      e:"Delimitations = chosen boundaries. Limitations = unavoidable weaknesses, reported honestly." },

    /* ---------- Causality and third variables ---------- */
    { t:"cause", k:"mc", x:"Ex-1",
      q:"A study finds a clear correlation between two variables. Why can't we conclude that one causes the other?",
      o:["Because correlations are always weak","Because of the direction problem, possible third variables, and chance","Because correlations only work with nominal data","Because a correlation proves the opposite"], a:1,
      e:"A relationship may run B → A (direction problem), be caused by a third variable affecting both, or appear by chance." },
    { t:"cause", k:"mc", x:"Ex-1",
      q:"Which three conditions together support a causal conclusion?",
      o:["Large sample, high p-value, online survey","Covariation, temporal order (cause before effect), and no alternative explanation","Correlation, peer review, and replication only","Random sampling, interviews, and a pilot study"], a:1,
      e:"Variables must covary, the cause must come first, and third variables must be ruled out, best through a controlled experiment." },
    { t:"cause", k:"case", x:"Ex-1",
      q:"Ice-cream sales and drowning accidents are correlated. Hot weather increases both. Hot weather is a…",
      o:["Mediating variable","Confounding (third) variable","Dependent variable","Moderating variable"], a:1,
      e:"A confounding variable affects both variables and creates a false relationship between them." },
    { t:"cause", k:"case",
      q:"Do violent games cause aggression, or do aggressive people choose violent games? This is the…",
      o:["Third-variable problem","Direction problem (reverse causality)","Regression to the mean","Hawthorne effect"], a:1,
      e:"The direction problem: even if A and B are related, we may not know whether A → B or B → A." },
    { t:"cause", k:"case", x:"Add-11",
      q:"During a security-training study a big data breach is all over the news, and post-test scores rise. Which threat to internal validity is this?",
      o:["Maturation","History","Testing effect","Instrumentation"], a:1,
      e:"History: an outside event during the study may explain the change. A control group exposed to the same event helps rule it out." },
    { t:"cause", k:"case",
      q:"Participants remember the pre-test questions and do better on the post-test. Which threat is this?",
      o:["Testing effect","History","Mortality","Selection"], a:0,
      e:"Taking the first test affects the second result. The Solomon four-group design measures this effect." },
    { t:"cause", k:"case",
      q:"Students selected because they had the lowest scores improve on a re-test without any treatment. This is…",
      o:["Maturation","Regression to the mean","Instrumentation","Experimenter bias"], a:1,
      e:"Unusually high or low results tend to move toward the average when measured again." },
    { t:"cause", k:"def",
      q:"Which threat matches: 'Participants change naturally over time (e.g. children read better just by growing older)'?",
      o:["Maturation","History","Attrition","Testing"], a:0,
      e:"Maturation is natural change in participants during the study period." },
    { t:"cause", k:"mc", x:"Add-3",
      q:"Why can researchers never be 100% sure that a group difference was caused by the hypothesised reason?",
      o:["Because statistics give probabilities, not proof, and uncontrolled third variables may explain the result","Because researchers always make arithmetic errors","Because p-values are always above 0.05","Because only qualitative studies can prove cause"], a:0,
      e:"Reduce the risk with random assignment, control groups, a strict significance level, and replication." },

    /* ---------- Reliability and validity ---------- */
    { t:"relval", k:"def", x:"Ex-12",
      q:"Which term matches: 'The measure gives consistent results under the same conditions'?",
      o:["Validity","Reliability","Generalisability","Significance"], a:1,
      e:"Reliability = consistency. Validity = measuring what you intend to measure." },
    { t:"relval", k:"mc", x:"Ex-12",
      q:"What do we mean when we say that reliability is a prerequisite for validity?",
      o:["A reliable measure is always valid","A measure with random, inconsistent results cannot be accurate, but a reliable measure can still be consistently wrong","Validity must be measured before reliability","Reliability and validity are the same"], a:1,
      e:"Valid ⇒ reliable, but reliable ≠ valid. A scale that always shows 2 kg too much is reliable but not valid." },
    { t:"relval", k:"case",
      q:"Two observers score the same recorded interviews and reach very similar scores. Which type of reliability does this show?",
      o:["Test–retest reliability","Inter-rater reliability","Internal consistency","Face validity"], a:1,
      e:"Inter-rater reliability: different people assessing the same thing agree." },
    { t:"relval", k:"def",
      q:"Which statistic is commonly used for internal consistency among questionnaire items measuring the same concept?",
      o:["Cohen's d","Cronbach's alpha","Levene's test","Chi-square"], a:1,
      e:"Cronbach's alpha above about 0.7 is usually acceptable." },
    { t:"relval", k:"case",
      q:"A security-awareness test covers phishing, passwords AND physical security, so it covers all important parts of the concept. Which validity is this?",
      o:["Face validity","Content validity","Predictive validity","External validity"], a:1,
      e:"Content validity: the measure covers all important parts of the concept." },
    { t:"relval", k:"def",
      q:"Which validity matches: 'The measure correlates with or predicts an outside standard, e.g. an entrance test that predicts later grades'?",
      o:["Construct validity","Criterion (predictive) validity","Face validity","Internal validity"], a:1,
      e:"Criterion validity: predictive (future outcome) or concurrent (matches an existing measure now)." },
    { t:"relval", k:"mc", x:"Add-11, Ex-9",
      q:"Internal validity is about…",
      o:["How well results apply to other people and settings","How sure we are that the IV, and nothing else, caused the change in the DV","Whether the questionnaire looks right","Whether the sample is large"], a:1,
      e:"Internal validity = 'did X cause Y?'. External validity = 'does it generalise?'." },
    { t:"relval", k:"mc", x:"Ex-7",
      q:"Which is a threat to the EXTERNAL validity of a survey study?",
      o:["A self-selected, unrepresentative sample","Random assignment","Using a control group","Double-blinding"], a:0,
      e:"Unrepresentative samples, non-response and artificial settings limit generalisation." },
    { t:"relval", k:"def",
      q:"Comparing results from several sources, methods or measures to strengthen validity is called…",
      o:["Triangulation","Operationalisation","Counterbalancing","Replication"], a:0,
      e:"The slides call comparing multiple sources triangulation." },
    { t:"relval", k:"mc",
      q:"Random measurement error mainly lowers ____; systematic error (bias) mainly lowers ____.",
      o:["validity; reliability","reliability; validity","power; significance","external validity; internal validity"], a:1,
      e:"Random noise makes results inconsistent (reliability). A consistent bias makes results wrong (validity)." },

    /* ---------- Surveys and representativity ---------- */
    { t:"survey", k:"mc", x:"Ex-5, Ex-10",
      q:"What is the difference between a population and a sample?",
      o:["They are the same","The population is the whole group you want to draw conclusions about; the sample is the smaller group you actually study","The sample is always larger","The population is the people who answer a survey"], a:1,
      e:"We study a sample to say something about the population, which only works if the sample is representative." },
    { t:"survey", k:"mc", x:"Ex-5, Ex-10",
      q:"Which method gives the best chance of a representative sample?",
      o:["Asking your classmates","Posting a survey link on social media","Random or stratified random sampling from a complete sampling frame","Interviewing whoever walks by"], a:2,
      e:"Probability sampling from a complete list makes representativeness most likely and allows generalisation." },
    { t:"survey", k:"mc",

      o:["Intent – prosecution","Ignorance – SETA and a clear acceptable-use policy","Accident – backups","Accident – job rotation"], a:1,
      e:"Ignorance is fixed by education, training and clear policy." },
    { t:"ch2", k:"mc", x:"E22-Q6, E23-Q4",
      q:"Punishment only deters unethical behaviour when three conditions are present. Which?",
      o:["Fear of the penalty, high probability of being caught, high probability the penalty is applied","A written policy, a lawyer, and a firewall","Large fines, media coverage, and an apology","Training, monitoring, and rewards"], a:0,
      e:"Example: log access to patient journals, tell staff, and actually discipline snooping." },
    { t:"ch2", k:"mc", x:"R20-Q6",
      q:"What is the difference between due care and due diligence?",
      o:["They are identical","Due care = taking the reasonable protective measures; due diligence = continuously checking and maintaining that they work","Due care is a law; due diligence is a policy","Due diligence applies only to states"], a:1,
      e:"Due care = install firewall and patch policy. Due diligence = regular audits that patches are actually applied." },
    { t:"ch2", k:"essay", x:"R20-Q6",
      q:"States have a due diligence duty not to let their territory be used for cyber operations against other states. How can this affect a 'normal' organisation's infosec and due care?",
      kp:["Define due care (reasonable protection) and due diligence (keep checking it works)","State duty raises expectations on organisations in its territory","Organisation must not let its systems be a launch point or transit (botnets, compromised servers)","Practical: patching, hardening IoT/servers, monitoring outbound traffic, incident reporting, cooperation with NSM/CERTs","Liability and reputation if negligent"],
      m:"Due care means taking the reasonable protective measures a prudent organisation would take; due diligence means continuously checking that they work. If a state must not knowingly allow its territory to be used for cyber operations, it will expect organisations inside it not to let their systems become launch points or transit nodes, for example as botnet zombies or compromised servers. This strengthens the organisation's own due care: patch and harden servers and IoT devices, monitor outbound traffic, report incidents and cooperate with NSM and CERTs. Failing to do so can create legal liability and reputational damage." },
    { t:"ch2", k:"mc",
      q:"Within how many hours must a personal data breach normally be reported to the supervisory authority (Datatilsynet) under GDPR?",
      o:["24 hours","48 hours","72 hours","7 days"], a:2,
      e:"Report within 72 hours; inform affected persons if the risk to them is high." },
    { t:"ch2", k:"def",
      q:"Which GDPR role decides why and how personal data is processed (e.g. the hospital), as opposed to the cloud provider that processes data on its behalf?",
      o:["Data controller","Data processor","Data protection officer","Data subject"], a:0,
      e:"Controller decides; processor processes for the controller. A data processing agreement is required." },
    { t:"ch2", k:"def",
      q:"Which risk assessment does GDPR require before high-risk processing of personal data?",
      o:["DPIA (Data Protection Impact Assessment)","BIA","TVA worksheet","FAIR"], a:0,
      e:"A DPIA assesses privacy risks before processing starts." },
    { t:"ch2", k:"mc",
      q:"Which list contains GDPR Art. 5 principles?",
      o:["Data minimisation, purpose limitation, storage limitation, accountability","Least privilege, need to know, separation of duties","Confidentiality, integrity, availability only","Deterrence, detection, recovery"], a:0,
      e:"Also: lawfulness/fairness/transparency, accuracy, integrity and confidentiality." },
    { t:"ch2", k:"mc",
      q:"How do law, ethics and policy differ?",
      o:["Law is enforced by the state with penalties; ethics are accepted norms of right and wrong; policies are organisational 'laws' in between","They are the same","Ethics are always laws","Policies override laws"], a:0,
      e:"Laws set the minimum; ethics describe what you should do; policy must not conflict with law." },
    { t:"ch2", k:"essay", x:"E22-Q6, E23-Q4",
      q:"Unethical behaviour can be difficult to deter. What are the general categories of unethical behaviour, and how can they be prevented? Exemplify.",
      kp:["Three causes: ignorance, accident, intent","Ignorance → education, training, clear policy (e.g. pirated software)","Accident → controls, least privilege, backups, change management (e.g. deleted database)","Intent → deterrence: monitoring, sanctions, legal action (e.g. selling customer data)","Deterrence needs fear of penalty, probability of being caught, penalty actually applied","Codes of ethics (ACM, ISC2) support professional behaviour"],
      m:"W&M sort causes into three groups. Ignorance: people do not know the rules, e.g. a new hire installs pirated software. Prevent with SETA and a clear acceptable-use policy. Accident: honest mistakes by people with access, e.g. an admin deletes a production database. Prevent with least privilege, backups and change management. Intent: deliberate wrongdoing, e.g. an employee sells customer data. Prevent with deterrence: log access, tell staff it is logged, and actually apply sanctions. Deterrence only works with fear of the penalty, a high chance of being caught and a high chance the penalty is applied." },

    /* ---------- Ch3 Strategy ---------- */
    { t:"ch3", k:"mc",
      q:"What is the correct order from top to bottom?",
      o:["Mission → vision → values → strategy → goals → objectives","Objectives → goals → strategy → vision","Policy → strategy → mission","Goals → mission → procedures"], a:0,
      e:"Strategy is derived from mission, vision and values, then broken into goals and measurable objectives." },
    { t:"ch3", k:"mc",
      q:"Which planning level has a 3–5 year horizon and is owned by the board, CEO and CISO?",
      o:["Operational","Tactical","Strategic","Contingency"], a:2,
      e:"Strategic (3–5 years) → tactical (1–3 years, middle managers) → operational (days–months)." },
    { t:"ch3", k:"mc",
      q:"Why does top-down implementation of a security strategy usually succeed better than bottom-up?",
      o:["It is cheaper","It has management authority, funding and ownership","It needs no planning","Technical staff dislike bottom-up"], a:1,
      e:"Bottom-up efforts often fail due to lack of authority and budget." },
    { t:"ch3", k:"def",
      q:"Which term matches: 'The responsibilities and practices of the board and executive management to give strategic direction, ensure objectives are met, manage risk and use resources responsibly'?",
      o:["Information security governance","Security maintenance","Benchmarking","Incident response"], a:0,
      e:"GRC links governance, risk management and compliance." },
    { t:"ch3", k:"mc", x:"E22-Q1, R20-Q1",
      q:"Norway's National Cyber Security Strategy (2019) is a useful operative example. What is its vision?",
      o:["Norway shall have the world's largest SOC","In Norway, it is safe to use digital services","All companies shall be ISO 27001 certified","No cyber attacks by 2030"], a:1,
      e:"It has five strategic goals and principles such as public–private and civil–military cooperation." },
    { t:"ch3", k:"def",
      q:"The SecSDLC phases are…",
      o:["Investigation → analysis → logical design → physical design → implementation → maintenance and change","Identify → protect → detect → respond → recover","Plan → do → check → act","Preparation → detection → containment → recovery"], a:0,
      e:"SecSDLC is a formal, waterfall-based method to build a security program." },
    { t:"ch3", k:"essay", x:"R20-Q1 (60%), E22-Q1 (60%)",
      q:"Elaborate on information security strategy with an operative example. You are responsible for strategy development: propose the overall tasks (e.g. 8 strategy elements) and an implementation plan.",
      kp:["Define strategy: long-term direction from mission, vision, values (strategic planning)","Operative example: Norway's National Cyber Security Strategy (vision, 5 goals, principles, measures)","8 elements: alignment, governance/roles, risk-based approach, goals/objectives, policy framework, people/culture (SETA), technology/architecture, resilience and follow-up","Planning levels: strategic → tactical → operational","Implementation: top-management approval and budget, gap/maturity analysis, prioritise by risk and cost-benefit, roadmap, owners and deadlines, communicate and train, implement stepwise (SecSDLC), measure with KPIs/balanced scorecard, yearly review (PDCA)","Discuss challenges: culture, resources, top-down support"],
      m:"A security strategy sets the long-term direction for protecting information assets, derived from the organisation's mission, vision and values. Norway's National Cyber Security Strategy is a good example: its vision is safe use of digital services, it has five goals (secure digitalisation, robust infrastructure, competence, detection and handling, police capability), guiding principles (public–private, civil–military, international) and measures assigned to ministries. For my organisation I would build eight elements: (1) alignment with mission and values, (2) governance and clear roles with a CISO mandate, (3) a risk-based approach with asset classification and gap analysis, (4) strategic goals and SMART objectives, (5) a policy framework (EISP, ISSP, SysSP) aligned with GDPR, Security Act and NIS2, (6) people and culture through SETA, (7) technology and architecture based on ISO 27001/NSM and defence in depth, (8) resilience and follow-up: IR/contingency plans, metrics, maintenance and yearly review. Implementation: get top-management approval and budget; analyse current state; prioritise by risk and cost-benefit; make a short/medium/long-term roadmap; assign owners and deadlines; communicate and train; implement step by step as projects; measure with KPIs or a balanced scorecard and review yearly (PDCA)." },
    { t:"ch3", k:"essay", x:"R22-Q4",
      q:"Before working on policy, the information security strategy should be in place. What would be a good implementation plan for the strategy?",
      kp:["Top-management approval and budget (top-down)","Current-state and gap analysis (maturity, risk)","Prioritise by risk and cost-benefit","Roadmap: short, medium, long term","Owners, resources, deadlines","Communicate and train","Implement stepwise as projects","Measure (KPIs, balanced scorecard) and review yearly"],
      m:"1) Secure top-management approval and budget. 2) Analyse current state and gaps with a maturity check and risk assessment. 3) Prioritise measures by risk and cost-benefit. 4) Make a roadmap that breaks the strategy into tactical and operational plans. 5) Assign owners, resources and deadlines. 6) Communicate to stakeholders and train staff. 7) Implement step by step as projects. 8) Measure with KPIs or a balanced scorecard and review yearly in a PDCA cycle." },

    /* ---------- Ch4 Policy ---------- */
    { t:"ch4", k:"mc",
      q:"Which order goes from most general to most detailed?",
      o:["Policy → standard → guideline/procedure","Procedure → policy → standard","Standard → policy → procedure","Guideline → policy → standard"], a:0,
      e:"Policy (what, mandatory) → standard (specific requirement) → guideline (advice) / procedure (step-by-step how)." },
    { t:"ch4", k:"case",
      q:"'Passwords must be at least 14 characters.' This is a…",
      o:["Policy","Standard","Guideline","Practice"], a:1,
      e:"A standard is a detailed, mandatory requirement that supports a policy." },
    { t:"ch4", k:"case", x:"E21-Q1",
      q:"An acceptable-use policy for email and internet is an example of which policy type?",
      o:["EISP","ISSP","SysSP","ACL"], a:1,
      e:"ISSP covers one issue or technology and how employees must use it." },
    { t:"ch4", k:"case", x:"E21-Q1",
      q:"A firewall rule set for the payroll server is an example of which policy type?",
      o:["EISP","ISSP","SysSP","Guideline"], a:2,
      e:"SysSP: managerial guidance plus technical specifications (ACLs, configuration rules) for one system." },
    { t:"ch4", k:"def", x:"E21-Q1",
      q:"Which policy is the top-level, organisation-wide policy that sets strategic direction, scope and tone for all security efforts?",
      o:["EISP","ISSP","SysSP","BCP"], a:0,
      e:"Enterprise Information Security Policy, also called the general security policy." },
    { t:"ch4", k:"mc", x:"E20-Q1, R21-Q2",
      q:"For a policy to be enforceable it must be…",
      o:["Disseminated, reviewed (read), comprehended, complied with (agreed), and uniformly enforced","Long, technical and secret","Approved by IT only","Written in English"], a:0,
      e:"W&M's criteria. Example: intranet + onboarding, short quiz, signed agreement, same rules for managers." },
    { t:"ch4", k:"def",
      q:"In the bull's-eye model, which layer is the outer foundation that gives direction to all technical controls?",
      o:["Applications","Systems","Networks","Policy"], a:3,
      e:"Policy → networks → systems → applications. Without policy, controls have no direction." },
    { t:"ch4", k:"mc",
      q:"What is the difference between an ACL and a capability table?",
      o:["ACL is attached to an object listing which users can access it; a capability table is attached to a user listing which objects they can access","They are identical","ACL lists passwords","Capability tables are only for firewalls"], a:0,
      e:"Both are part of SysSP technical specifications." },
    { t:"ch4", k:"essay", x:"E20-Q1 (60%), E21-Q1 (60%), R21-Q2, E22-Q3, R22-Q3",
      q:"Elaborate on information security policy. You are responsible for the policy in the organisation you are hired in: what are the overall tasks to make a good policy, and how would you implement it?",
      kp:["Define policy, standard, guideline, procedure; bull's-eye model (policy as foundation)","Three types: EISP, ISSP, SysSP with examples","Tasks: strategy first and risk-based; top-management mandate; team with IT/HR/legal/DPO; map laws (GDPR, Security Act, NIS2) and standards (ISO 27001/27002, NSM); write EISP then ISSPs and SysSPs; short, clear, enforceable; approval; policy owner and review schedule","Enforceability criteria: disseminated, reviewed, comprehended, complied with, uniformly enforced","Implementation: distribute, train and quiz, sign/agree, enforce uniformly, support with procedures, measure (audits, metrics), review yearly and after incidents","Operative example (e.g. a real policy or Østre Toten lessons)"],
      m:"A policy is a set of management rules for required and forbidden behaviour. It is the foundation in the bull's-eye model, supported by standards, guidelines and procedures. W&M define three types: the EISP (organisation-wide direction), ISSPs (one issue, e.g. acceptable use of email, BYOD, AI tools) and SysSPs (one system, e.g. firewall rules, ACLs). My tasks: make sure the strategy exists and do a risk assessment first; get a top-management mandate; form a team with IT, HR, legal, the DPO and users; map laws (GDPR, Security Act, NIS2) and standards (ISO 27001/27002, NSM basic principles); write the EISP first, then ISSPs and SysSPs; keep them short and enforceable with roles and sanctions; get approval; appoint a policy owner and review schedule. Implementation follows the enforceability criteria: disseminate via intranet and onboarding, make sure people read and understand it (training, quiz), get agreement (sign/click), enforce uniformly including managers, support with procedures and a help desk, measure with audits and metrics, and review yearly and after incidents or new laws." },

    /* ---------- Research based learning ---------- */
    { t:"rbl", k:"def",
      q:"In academic writing (RBL slides), 'outlining an argument from what you know, then researching to fill the gaps' is which mode?",
      o:["Deduction","Induction","Abduction","Triangulation"], a:0,
      e:"Deduction = finding data to support an argument (active reading). The slides call it the best in practice." },
    { t:"rbl", k:"def",
      q:"'Researching the topic first, then forming an argument from the research' is which mode?",
      o:["Deduction","Induction","Abduction","Delphi"], a:1,
      e:"Induction is the most common but less effective mode: you risk over-reading and losing your own voice." },
    { t:"rbl", k:"def",
      q:"'Making clear the assumptions (warrant) that let you move from data to argument' is which mode?",
      o:["Deduction","Induction","Abduction","Benchmarking"], a:2,
      e:"Abduction deepens critique by questioning underlying assumptions." },
    { t:"rbl", k:"mc",
      q:"According to the course's review guide, which parts does the examiner read first and use to form an overall impression?",
      o:["References and appendices","Abstract and conclusions","Figures only","The background section"], a:1,
      e:"Abstract and conclusions must be written with much more care than the rest." },

    /* ---------- Ch5 Program & people ---------- */
    { t:"ch5", k:"mc",
      q:"Why is it often better for the security function to report outside the IT department?",
      o:["It is cheaper","It reduces conflicts of interest: IT wants speed, security wants control","IT does not understand security","Laws require it"], a:1,
      e:"Placement options: under CIO, own department under CEO, legal, risk management, admin services." },
    { t:"ch5", k:"def",
      q:"In W&M, security staff are grouped as definers, builders and administrators. Who are the definers?",
      o:["Policy and risk people such as the CISO and managers","Engineers who implement controls","Operators who monitor daily","External auditors"], a:0,
      e:"Builders design and implement; administrators operate and monitor." },
    { t:"ch5", k:"mc", x:"R20-Q3, E23-Q3",
      q:"Match SETA parts to their goal.",
      o:["Awareness = what (recognise threats); training = how (job skills); education = why (deep understanding)","Awareness = why; training = what; education = how","All three are the same","Education is for all employees"], a:0,
      e:"Awareness for everyone (posters, phishing tests); training for staff with security tasks; education for security professionals." },
    { t:"ch5", k:"case",
      q:"An employee locks the screen because they think it matters, colleagues do it, and it is easy. Which theory explains this?",
      o:["Theory of Planned Behaviour","General Deterrence Theory","Dynamic capability theory","Chinese Wall"], a:0,
      e:"TPB: attitude, subjective norms and perceived behavioural control shape intention and behaviour." },
    { t:"ch5", k:"def",
      q:"Which theory says people protect themselves when they see a serious, likely threat AND believe they can carry out an effective protective action?",
      o:["Protection Motivation Theory","General Deterrence Theory","Theory of Planned Behaviour","Schein's culture model"], a:0,
      e:"PMT: threat appraisal + coping appraisal." },
    { t:"ch5", k:"mc",
      q:"Schein describes organisational culture in three levels. Which?",
      o:["Artifacts, espoused values, basic assumptions","Policy, standard, procedure","Strategic, tactical, operational","Awareness, training, education"], a:0,
      e:"Basic assumptions are what people really take for granted when nobody is watching." },
    { t:"ch5", k:"mc", x:"E21-Q6",
      q:"Which type of trust in information sharing is the highest level, based on shared values and goals?",
      o:["Calculus-based trust","Knowledge-based trust","Identification-based trust","Contract-based trust"], a:2,
      e:"Calculus-based (rules, contracts) → knowledge-based (past behaviour) → identification-based (shared values)." },
    { t:"ch5", k:"def", x:"E21-Q6",
      q:"Information labelled TLP:AMBER may be shared…",
      o:["Publicly","With the whole community","Within the recipient's own organisation on a need-to-know basis","Only with the named recipients"], a:2,
      e:"RED = named recipients, AMBER = own organisation need-to-know, GREEN = community, CLEAR = public." },
    { t:"ch5", k:"essay", x:"E21-Q6",
      q:"Trust in information sharing is paramount. Which type of trust is important, why, and how can you generate a higher level of trust?",
      kp:["Calculus-based (rules, contracts, sanctions) → knowledge-based (past behaviour) → identification-based (shared values, highest)","Why: organisations only share threat information with partners they trust; sharing improves external monitoring and response","Raise trust: clear rules (TLP, NDAs), reciprocity, regular meetings and exercises","Secure platforms (MISP, PGP), published service descriptions (RFC 2350)","Track record of handling shared data well"],
      m:"Trust grows in three levels: calculus-based trust rests on rules, contracts and sanctions; knowledge-based trust on knowing the partner's past behaviour; identification-based trust on shared values and goals, which is the level that makes sharing easy. It matters because CERTs, partners and sectors only share sensitive threat information if they trust how it will be used. To raise trust I would agree clear rules such as TLP and NDAs, share reciprocally, meet and exercise regularly, use secure platforms like MISP and PGP, publish an RFC 2350 service description, and build a track record of handling shared data well." },
    { t:"ch5", k:"mc",
      q:"Why are job rotation and mandatory vacation used in personnel security?",
      o:["To save money","So fraud or errors become visible when someone else does the job","To reduce training costs","To comply with GDPR"], a:1,
      e:"They are controls during employment, alongside least privilege and separation of duties." },
    { t:"ch5", k:"essay", x:"E21-Q3",
      q:"What information security positions would you as a manager consider important, and how would you argue to get them approved?",
      kp:["Positions: CISO, security manager, architect, engineer, SOC analyst, incident responder, DPO, awareness coordinator","Roles: definers, builders, administrators; data owner/custodian/user","Business case: risk assessment shows exposure","Cost of likely incident vs salary","Legal requirements (GDPR, NIS2, Security Act)","Benchmarking and past incidents (e.g. Østre Toten)","Clear KPIs the role will deliver"],
      m:"Key positions: a CISO for strategy, policy and reporting to top management; a security manager for the daily program; architects and engineers who build and maintain controls; SOC analysts and incident responders; a DPO for GDPR; and an awareness coordinator for SETA. To get them approved I would build a business case: show the risk assessment and expected loss (e.g. ALE) compared to the salary cost, point to legal duties such as GDPR, NIS2 and the Security Act, benchmark against similar organisations, use real incidents like Østre Toten 2021, and promise measurable KPIs." },
    { t:"ch5", k:"essay", x:"R20-Q3, E23-Q3, R21-Q3",
      q:"Cyber attacks are increasing and more educated security personnel are needed. How would you meet these challenges (SETA / security program) in the organisation you are hired in?",
      kp:["Assess needs: roles, current skills, risk areas","Awareness for everyone: onboarding, yearly, phishing simulations","Role-based training for IT, developers, managers","Education and certifications for the security team (CISSP, CISM, master's)","Exercises (tabletop, crisis drills) with management","Measure effect (click rates, incidents, quizzes) and adjust","Recruit and retain: career paths, university partnerships","Link to strategy, risk assessment and program placement"],
      m:"I would start with a needs assessment of roles, skills and risk areas. Then run SETA in three layers: awareness for all employees (onboarding, yearly refreshers, phishing simulations), role-based training for IT, developers and managers, and education and certifications for the security team. Add tabletop and crisis exercises that include top management. Measure the effect through click rates, incident numbers and quizzes, and adjust. Finally, recruit and keep people with career paths and university partnerships, and anchor everything in the strategy and risk assessment." },

    /* ---------- Ch6 Risk assessment ---------- */
    { t:"ch6", k:"mc",
      q:"Risk assessment consists of…",
      o:["Risk identification, risk analysis, risk evaluation","Defence, transference, mitigation","Detection, reaction, recovery","Planning, organising, leading"], a:0,
      e:"Risk management = context → identify → analyse → evaluate → treat → monitor, with communication throughout." },
    { t:"ch6", k:"mc", x:"R20-Q2",
      q:"What is the difference between asset classification and asset categorization?",
      o:["Classification labels sensitivity (public, internal, confidential, secret); categorization rates impact on C, I, A (low/moderate/high)","They are the same","Categorization labels sensitivity","Classification is only for hardware"], a:0,
      e:"FIPS 199: overall category = highest of the three CIA ratings." },
    { t:"ch6", k:"mc", x:"R20-Q2",
      q:"Which question is one of W&M's asset valuation questions?",
      o:["Which asset generates the most revenue, or would be most expensive to replace or most embarrassing if revealed?","Which asset is newest?","Which asset is used by the CEO?","Which asset has the longest name?"], a:0,
      e:"Also: which asset is most critical to the organisation's success?" },
    { t:"ch6", k:"mc",
      q:"An asset is worth 200,000 NOK, 50% is damaged per incident, and incidents happen twice per year. What is the ALE?",
      o:["100,000 NOK","200,000 NOK","400,000 NOK","50,000 NOK"], a:1,
      e:"SLE = 200,000 × 0.5 = 100,000. ALE = SLE × ARO = 100,000 × 2 = 200,000 NOK/year." },
    { t:"ch6", k:"def", x:"R20-Q2",
      q:"Which tool is a likelihood × impact grid, coloured green/yellow/red, used to present risks to management?",
      o:["Risk matrix (heat map)","TVA worksheet","Attack tree","Balanced scorecard"], a:0,
      e:"Weighted table analysis helps rank assets; the risk matrix presents the results." },
    { t:"ch6", k:"def",
      q:"Which risk method expresses risk in money (loss event frequency × loss magnitude) and is good for board communication?",
      o:["FAIR","OCTAVE","Delphi","STRIDE"], a:0,
      e:"FAIR is quantitative. OCTAVE is a qualitative, workshop-based, self-directed method." },
    { t:"ch6", k:"def",
      q:"Which method has experts rate risks anonymously in rounds until they agree, useful when there is little data?",
      o:["Delphi technique","FAIR","ISO 27005","ALE"], a:0,
      e:"Good for new threats where historic data is missing." },
    { t:"ch6", k:"case", x:"E20-Q2, R21-Q1, E23-Q5",
      q:"A municipality uses a general risk and resilience (ROS) template that treats cyber like a power outage. What should it add?",
      o:["Nothing","An InfoSec-specific method (ISO 27005 or OCTAVE), a socio-technical analysis, threat intelligence (MITRE ATT&CK, NSM/PST), and FAIR for cost","Only more firewalls","A bigger insurance policy"], a:1,
      e:"Cyber attacks need their own place in the risk register (lesson from Østre Toten)." },
    { t:"ch6", k:"mc",
      q:"Which STRIDE threat violates integrity?",
      o:["Spoofing","Tampering","Repudiation","Denial of service"], a:1,
      e:"Spoofing–authentication, Tampering–integrity, Repudiation–non-repudiation, Information disclosure–confidentiality, DoS–availability, Elevation–authorisation." },
    { t:"ch6", k:"mc",
      q:"Threat, vulnerability and risk — which pairing is correct?",
      o:["Threat = ransomware gang; vulnerability = no MFA on remote access; risk = likelihood × impact","Threat = no MFA; vulnerability = ransomware gang","Risk = the attacker","Vulnerability = the consequence"], a:0,
      e:"A threat exploits a vulnerability, causing an incident and consequences." },
    { t:"ch6", k:"essay", x:"R21-Q1 (60%), E20-Q2, R22-Q2, E22-Q4, E23-Q5",
      q:"Your organisation's risk management process leaves out several information security issues. Which InfoSec risk analysis method(s) would you use to improve it, and why? Then, why and how would you choose feasible risk treatments?",
      kp:["Why general ROS templates are incomplete for cyber","Methods: ISO/IEC 27005, NIST SP 800-30, OCTAVE (Allegro), FAIR, Delphi, DSB ROS, socio-technical analysis","When to use each (ISO users, public sector, internal workshops, board communication, little data)","Asset classification/categorisation, TVA, risk matrix","Threat input: MITRE ATT&CK, NSM/PST/ENISA threat assessments","Treatments: defence, transference, mitigation, acceptance, termination with examples","Feasibility: economic (CBA), organisational, operational, technical, political","Residual risk, risk appetite, monitoring"],
      m:"General ROS templates (like DSB's for municipalities) treat cyber like any other hazard and miss assets, threat actors and human factors. I would add ISO/IEC 27005 (fits an ISO 27001 ISMS) or OCTAVE Allegro (internal, asset-focused workshops), a socio-technical analysis for culture and awareness (Østre Toten had a technical analysis but missed these), MITRE ATT&CK and NSM/PST threat assessments for realistic threats, and FAIR to express risk in money to management. Delphi helps when data is scarce. Start by classifying and categorising assets, build a TVA worksheet and show results in a risk matrix. Then treat the risks, because resources are limited and not all risks can be removed: defence (patching, MFA), transference (insurance, outsourcing), mitigation (IR, DR plans, backups), acceptance (low-value assets) or termination (shut down a legacy service). Check feasibility: cost-benefit (ALE before − ALE after − cost), organisational fit, user acceptance, technical fit and political support. Document residual risk against the risk appetite and monitor continuously." },
    { t:"ch6", k:"essay", x:"R20-Q2",
      q:"You are classifying and categorising information assets but do not know their value or how to prioritise. How would you move forward, and which impact and risk matrices would you use to present the result to management?",
      kp:["Inventory assets with owners","Classification by sensitivity (open, internal, confidential, strictly confidential)","Categorisation by CIA impact (FIPS 199 low/moderate/high, highest wins)","W&M valuation questions (critical, revenue, replacement cost, embarrassment/liability)","Weighted table analysis with weighted criteria","Present with impact table and 5×5 likelihood × impact heat map"],
      m:"First build an asset inventory with owners. Classify each asset by sensitivity (open, internal, confidential, strictly confidential) and categorise by the impact on confidentiality, integrity and availability (low/moderate/high, overall = highest). Value assets with W&M's questions: which is most critical, earns most, costs most to replace, or would be most embarrassing or create liability if revealed. Rank them in a weighted table analysis (e.g. revenue 30%, reputation 40%, legal 30%). Present to management with an impact table per asset and a 5×5 likelihood × impact heat map in green, yellow and red." },

    /* ---------- Ch7 Risk treatment ---------- */
    { t:"ch7", k:"case", x:"R21-Q1",
      q:"Buying cyber insurance is which risk treatment strategy?",

    { t:"ch7", k:"mc",

    { t:"ch8", k:"mc", x:"E20-Q3",
      q:"File permissions and database rights on individual records are which type of access control?",

    { t:"ch8", k:"essay", x:"E20-Q3",
      q:"What is the difference between physical, logical, system and data access control? How would you combine them and why? Exemplify.",
      kp:["Physical: buildings, rooms, hardware (key cards, guards)","Logical: networks and resources via software (firewalls, VPN, passwords)","System: OS and application accounts and privileges","Data: individual files, records, fields (permissions, encryption)","Combine in layers = defence in depth","Principles: least privilege, need to know, separation of duties"],
      m:"Physical access control protects buildings and hardware (key cards, locks, guards). Logical access control protects networks and resources through software (firewalls, VPN, passwords). System access control governs operating systems and applications (user accounts, privileges). Data access control protects individual files and records (permissions, encryption, DB rights). I would combine them in layers so an attacker must pass the door, the network, the system login and the data permissions (defence in depth), all based on least privilege and need to know. Example: a hospital uses key cards to the server room, VPN with MFA, role-based accounts in the journal system, and record-level access logging." },
    { t:"ch8", k:"essay", x:"E23-Q1 (60%)",
      q:"Discuss and compare 3 security management frameworks; discuss architectural models with positives and negatives; position management vs architecture models via properties.",
      kp:["ISO/IEC 27001/27002: international, ISMS + 93 controls, certifiable; strong recognition but costly","NIST CSF 2.0: 6 functions, tiers, profiles; free, flexible, good for maturity; not certifiable, US-oriented","NSM Basic Principles: Norwegian, 4 categories, concrete; less known internationally","Architecture: BLP (confidentiality, rigid), Biba (integrity, ignores confidentiality), Clark-Wilson (business integrity, complex), Brewer-Nash (conflict of interest, narrow), Common Criteria (product certification, slow/expensive)","Positioning table: level, question answered, audience, focus, output","They complement each other"],
      m:"ISO/IEC 27001/27002 is an international, certifiable ISMS with 93 controls in four themes; it is globally recognised but costly and documentation-heavy. NIST CSF 2.0 has six functions (Govern, Identify, Protect, Detect, Respond, Recover), tiers and profiles; it is free and easy to explain to management, but not certifiable. NSM Basic Principles are Norwegian, practical and free, in four categories, but less known abroad. Architecture models: Bell-LaPadula protects confidentiality (no read up, no write down) but ignores integrity; Biba protects integrity but ignores confidentiality; Clark-Wilson fits business processes with separation of duties but is complex; Brewer-Nash prevents conflicts of interest but has a narrow use case; Common Criteria certifies products internationally but is slow and expensive. Positioning: management models work at organisation level, answer 'what should we manage', target CISOs and auditors and produce an ISMS and maturity levels; architecture models work at system level, answer 'how is access enforced', target architects and evaluators and produce access rules and certified products. They complement each other." },

    { t:"ch9", k:"mc", x:"R22-Q5, E23-Q6",

      q:"Which RFC describes what a CSIRT should publish about itself (contacts, services, PGP keys, hours)?",

    { t:"ch9", k:"essay", x:"R22-Q5, E23-Q6",
      q:"What are the differences between a CSIRT, a CERT and a SOC, and how would an organisation benefit from them?",
      kp:["SOC: continuous monitoring, detection and triage (SIEM), proactive","CSIRT: incident response – isolate, mitigate, recover; reactive + advisories","CERT: coordinates, warns and promotes best practice for a sector or nation","Examples (Telenor SOC, NorCERT, HelseCERT, KraftCERT)","Benefits: faster detection/response, less damage and downtime, threat intelligence, expert help, compliance with reporting duties","SOC often hands incidents to CSIRT; terms overlap"],
      m:"A SOC monitors the organisation 24/7, detects and triages alerts with SIEM and is proactive. A CSIRT handles incidents: it isolates, mitigates and recovers, and issues advisories. A CERT coordinates and warns a whole sector or nation and promotes best practice, e.g. NorCERT, HelseCERT or KraftCERT. In practice a SOC passes confirmed incidents to the CSIRT. Benefits: faster detection and response, less damage and downtime, access to threat intelligence and sector warnings, expert help and easier compliance with reporting duties." },
    { t:"ch9", k:"essay", x:"E20-Q6",

      m:"Known models include CMMI (five levels from Initial to Optimizing), the NIST CSF implementation tiers, C2M2 for energy, SSE-CMM and Wahlgren & Kowalski's model. Like the University of Chicago BSD, I would measure the baseline per area, set a target, show gaps in a heat map, prioritise improvements with management, implement them and re-measure yearly or after exercises, improving one step at a time." },

    { t:"ch10", k:"essay", x:"E20-Q5, R21-Q4, E22-Q5",
      q:"You lead the contingency planning management team (CPMT). What are the proper steps to organise contingency planning, and how would you build a life cycle strategy to keep the work continuous?",
      kp:["CPMT: champion (senior executive), project manager, members from business, IT, InfoSec, HR, legal, communications; IR/DR/BC teams below","CP = BIA + IR + DR + BC","NIST SP 800-34 seven steps: policy, BIA, preventive controls, strategies, plans, testing/training/exercises, maintenance","BIA: processes, recovery criticality, MTD/RTO/RPO, resources","Life cycle: plan owner, yearly review and after incidents/changes, exercises incl. top management, lessons learned (PDCA), updated contacts/contracts","Link to risk assessment and the maintenance model"],
      m:"First I set up the CPMT with a senior champion who gives authority and budget, a project manager and members from business units, IT, InfoSec, HR, legal and communications, with IR, DR and BC teams under it. I follow NIST SP 800-34: 1) write the CP policy statement, 2) run the BIA to find critical processes, recovery criticality, MTD, RTO and RPO, 3) identify preventive controls, 4) choose recovery strategies (backups, alternate sites), 5) write the IR, DR and BC plans, 6) test, train and exercise, 7) maintain the plans. To make it continuous: assign plan owners, review at least yearly and after every incident, exercise or major change, run exercises from tabletop to full simulations with top management, feed lessons learned back into the plans (PDCA), keep contact lists and contracts current, and link CP to the risk assessment and the security maintenance model." },
    { t:"ch10", k:"essay", x:"E21-Q4, R20-Q4",
      q:"What is the difference between an incident response plan and a disaster recovery plan? Exemplify how they help during an incident.",
      kp:["IR: detect, contain, eradicate, recover from an incident at the primary site (NIST 800-61 phases)","DR: restore systems, data, facilities after a disaster","BC as the third plan (alternate site)","Example IR: phishing → compromised account: isolate PC, reset passwords, remove malware","Example DR: ransomware encrypts all servers → rebuild from offline backups","Escalation from incident to disaster"],
      m:"An IR plan handles a security incident at the primary site: preparation, detection and analysis, containment, eradication and recovery, and lessons learned. Example: a phishing email compromises an account; the IR team isolates the PC, resets passwords and removes the malware. A DR plan is used when the incident becomes a disaster that the organisation cannot contain, such as ransomware encrypting all servers; the DR team restores systems and data from offline backups. If business cannot run at the primary site meanwhile, the BC plan moves critical functions to an alternate site." },
    { t:"ch10", k:"essay", x:"E21-Q5",
      q:"What recovery criticality would you consider important in a business continuity plan?",

    { t:"ch11", k:"essay", x:"E21-Q2, E22-Q2, R22-Q1 (60%), R20-Q5, R21-Q5",
      q:"Security maintenance is labour-intensive. How can you use the security maintenance model to make an optimised culture for managing and operating security over time?",
      kp:["Five areas explained with examples (external monitoring, internal monitoring, planning and risk assessment, vulnerability assessment and remediation, readiness and review)","Routine database / risk, threat and vulnerability databases","NIST SP 800-100 areas","Culture: routine not project, clear owners, reports to management","Involve people, share results, appreciative inquiry","Learning: root cause analysis, lessons learned, double-loop learning","Train and exercise incl. top management; measure maturity yearly","Share with CERTs and partners (trust, TLP)"],
      m:"The W&M maintenance model has five areas. External monitoring watches CERTs, police and military intelligence, partners and vendor advisories for early warning. Internal monitoring uses the SOC, SIEM, asset inventories and maturity checks. Planning and risk assessment keeps plans current with root-cause and socio-technical analysis. Vulnerability assessment and remediation finds and fixes weaknesses through scans, pen tests and patching, plus physical resilience such as power and an alternative office. Readiness and review checks strategy, policies and plans through internal control, management review, training and exercises. To build a culture over time I would make maintenance a fixed yearly routine with owners per area and reports to management, use a routine database so known events are handled consistently and new ones update it, involve staff by sharing results and celebrating improvements (appreciative inquiry), learn from incidents with root-cause analysis and double-loop learning, train and exercise regularly with top management, measure maturity yearly, and share threat information with CERTs and partners under TLP." },
    { t:"ch11", k:"essay", x:"E23-Q2",

      kp:["External monitoring → threat intelligence improves IR preparation and early warning","Internal monitoring → SOC/SIEM alerts are the IR detection phase","Planning and risk assessment ← lessons learned update risk and plans","Vulnerability assessment ← weaknesses exploited in incidents fixed everywhere","Readiness and review → IR plans tested in exercises and reviewed after incidents","Why: faster detection/response, no repeated incidents, plans match real threats, better resource use, learning organisation instead of silos"],
      m:"Each maintenance area links to an IR phase. External monitoring feeds threat intelligence into IR preparation. Internal monitoring (SOC/SIEM) is IR's detection phase. Lessons learned from incidents update planning and risk assessment. Weaknesses exploited in an incident are remediated across all systems. Readiness and review tests IR plans in exercises and reviews them after every incident. Combining them gives faster detection and response, prevents repeat incidents, keeps plans matched to real threats, uses resources better and makes the organisation learn instead of working in silos." }

    { t:"inet", k:"mc", x:"2024 Q2, 2025 Q11",

    { t:"inet", k:"mc",

    { t:"ac", k:"case",

      o:["ABAC","DAC","MAC","BLP"], a:0,

    { t:"ac", k:"mc", x:"2025 Q18",

    { t:"ac", k:"mc", x:"2024 Q24",

      o:["ACL = a column (one object, rights of each subject); capability ticket = a row (one subject, rights on each object)","ACL = a row; capability = a column","Both are columns","Both list passwords"], a:0,

    { t:"ac", k:"mc", x:"2025 Q19",

    { t:"ac", k:"mc",
      q:"In Bell-LaPadula, the simple security condition and the *-property are…",

    { t:"ac", k:"mc",
      q:"Security levels with categories: does (Top Secret, {NUC, ASI}) dominate (Confidential, {EUR, ASI})?",

    { t:"ac", k:"mc",
      q:"In the Biba low-water-mark policy, what happens when a subject reads a lower-integrity object?",
      o:["The read is blocked","The subject's integrity level drops to the minimum of the two","The object is upgraded","Nothing"], a:1,
      e:"i′(s) = min(i(s), i(o)). Writing requires i(o) ≤ i(s)." },
    { t:"ac", k:"mc", x:"2025 Q21",

    { t:"ac", k:"mc", x:"2025 Q20",

    { t:"ac", k:"mc", x:"2025 Q24",

      e:"They prevent different evaluations of the same product from disagreeing." },

    /* ---------- Buffer overflow ---------- */

    { t:"bof", k:"mc", x:"2024 Q7",
      q:"Which statement about buffer overflow is INCORRECT?",
      o:["Java and Python do not suffer from buffer overflow vulnerabilities","Shellcode is the desired machine code in the overflowed buffer","A NOP sled is a defence mechanism, so the shellcode never runs","gets, strcpy and strcat are unsafe C routines"], a:2,

    { t:"bof", k:"mc", x:"2025 Q9",
      q:"Which statement about buffer overflow is correct?",
      o:["It can be exploited to gain execution on the victim machine","gets, strcpy and strcat are safe routines","A NOP sled is a defence","It cannot happen in C"], a:0,
      e:"Classic stack smashing lets the attacker run shellcode." },
    { t:"bof", k:"mc",
      q:"What are the two broad categories of buffer overflow defences?",
      o:["Compile-time defences and run-time defences","Firewalls and antivirus","Encryption and hashing","Static and dynamic IP"], a:0,
      e:"Compile-time hardens new programs; run-time protects existing ones." },
    { t:"bof", k:"mc", x:"2025 Q9",
      q:"Which are COMPILE-TIME defences against buffer overflow?",
      o:["Safe programming language and stack protection with a random canary","Non-executable memory and ASLR","Guard pages and firewalls","Fuzzing and IDS"], a:0,

      chk:true },
    { t:"bof", k:"mc", x:"2025 Q9",

    { t:"bof", k:"mc", x:"2024 Q21",

    { t:"bof", k:"case", x:"2024 Q21",

      e:"Also check whether it is written in a memory-safe language." },

    { t:"ids", k:"mc", x:"2025 Q16",

    { t:"ids", k:"mc", x:"2024 Q10",

    { t:"os", k:"tf", x:"2025 Q4",

    { t:"os", k:"mc",

    { t:"dos", k:"def",

      o:["Deauthentication attack","Slow Loris","Memcached amplification","Denial of sleep"], a:0,

      o:["Memcached","DNS","NTP","HTTP"], a:0,

<script>
/* ================================================================
   COURSE: IMT4133 – COMING SOON
   Replace status "soon" with "active" and fill in exam, topics and
   questions (same format as the courses above).
   ================================================================ */
COURSES.push({
  code: "IMT4133",
  name: "Not added yet",
  exam: "2026-12-31",
  examInfo: "",
  color: "slate",
  status: "soon",
  topics: [],
  questions: []
});
