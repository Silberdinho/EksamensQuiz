      q:"Which model has three dimensions: information states × CIA × safeguards (policy, education, technology)?",
      o:["Bull's-eye model", "McCumber Cube", "Cyber Kill Chain", "PDCA"], a:1,
      e:"The McCumber Cube shows that security needs policy, education AND technology." },
    { t:"ch1", k:"mc",
      q:"Which are the three communities of interest that share responsibility for security?",
      o:["Police, military, government", "Users, hackers, vendors", "InfoSec management, IT management, general business management", "CISO, CEO, CFO only"], a:2,
      e:"Security is not only an IT task; business management shares responsibility." },
    { t:"ch1", k:"mc", x:"E20-Q4",
      q:"Cybersecurity is often treated as an IT problem rather than an operational one. Which measure helps close this gap?",
      o:["Let the IT department handle all incidents alone, without involving management", "Buy more firewalls and antivirus software, since technology solves the problem", "Outsource all security to a vendor so the organisation has no responsibility", "Management ownership, cyber in the organisation's risk analysis, joint crisis plans and exercises, and clear response and recovery roles"], a:3,
      e:"Incidents must involve top management, crisis teams, communication and legal, not just IT." },
    { t:"ch1", k:"def",
      q:"Which list gives the six Ps of InfoSec management?",
      o:["Planning, Policy, Programs, Protection, People, Project management","Plan, Prepare, Protect, Prevent, Patch, Proceed","People, Process, Product, Price, Place, Promotion","Policy, Procedure, Practice, Principle, Profile, PDCA"], a:0,
      e:"W&M's six Ps describe the areas InfoSec management must cover." },
    { t:"ch1", k:"def", x:"R22-Q6",
      q:"Which writing style starts an email to management with the conclusion and the required action, then gives the background?",
      o:["IMRaD (Introduction, Method, Results, Discussion)", "BLUF (Bottom Line Up Front)", "STRIDE (threat categories)", "TLP (Traffic Light Protocol)"], a:1,
      e:"Example: 'BLUF: Critical vulnerability in the HR system. I recommend taking it offline until patched tonight. Decision needed by 14:00.'" },
    { t:"ch1", k:"essay", x:"R22-Q6",
      q:"A critical vulnerability is discovered in one of your organisation's newly implemented systems. As CISO, how would you build a BLUF email to the CTO?",
      kp:["Bottom line first: what is wrong and the recommended action","Decision needed and deadline","Short background: what happened, which system","Impact/risk (data, operations, legal)","Actions already taken and next steps","Contact person and when the next update comes"],
      m:"Subject: CRITICAL – vulnerability in new HR system, decision needed by 14:00. BLUF: Outsiders can read employee data in the new HR system. I recommend taking it offline until the vendor patch is applied tonight. I need your approval by 14:00. Background: found during this morning's scan; the flaw is public and actively exploited. Impact: possible GDPR breach and 72-hour notification duty if data was accessed. Done so far: logs secured, access restricted to VPN. Next: patch tonight, verify, report status 08:00 tomorrow. Contact: me (name and phone number)." },

    /* ---------- Ch2 ---------- */
    { t:"ch2", k:"mc", x:"E22-Q6, E23-Q4",
      q:"Whitman & Mattord group the causes of unethical behaviour into three categories. Which?",
      o:["Greed, fear, revenge", "Hackers, insiders, nations", "Technical, physical, administrative", "Ignorance, accident, intent"], a:3,
      e:"Prevent ignorance with education and clear policy, accidents with controls, and intent with deterrence." },
    { t:"ch2", k:"case", x:"E22-Q6, E23-Q4",
      q:"A new employee installs pirated software, not knowing it is forbidden. Which category, and the best prevention?",
      o:["Ignorance – SETA and a clear acceptable-use policy", "Intent – prosecution", "Accident – backups", "Accident – job rotation"], a:0,
      e:"Ignorance is fixed by education, training and clear policy." },
    { t:"ch2", k:"mc", x:"E22-Q6, E23-Q4",
      q:"Punishment only deters unethical behaviour when three conditions are present. Which?",
      o:["A written policy, a lawyer, and a firewall", "Fear of the penalty, high probability of being caught, high probability the penalty is applied", "Large fines, media coverage, and an apology", "Training, monitoring, and rewards"], a:1,
      e:"Example: log access to patient journals, tell staff, and actually discipline snooping." },
    { t:"ch2", k:"mc", x:"R20-Q6",
      q:"What is the difference between due care and due diligence?",
      o:["They are identical", "Due care is a law; due diligence is a policy", "Due care = taking the reasonable protective measures; due diligence = continuously checking and maintaining that they work", "Due diligence applies only to states"], a:2,
      e:"Due care = install firewall and patch policy. Due diligence = regular audits that patches are actually applied." },
    { t:"ch2", k:"essay", x:"R20-Q6",
      q:"States have a due diligence duty not to let their territory be used for cyber operations against other states. How can this affect a 'normal' organisation's infosec and due care?",
      kp:["Define due care (reasonable protection) and due diligence (keep checking it works)","State duty raises expectations on organisations in its territory","Organisation must not let its systems be a launch point or transit (botnets, compromised servers)","Practical: patching, hardening IoT/servers, monitoring outbound traffic, incident reporting, cooperation with NSM/CERTs","Liability and reputation if negligent"],
      m:"Due care means taking the reasonable protective measures a prudent organisation would take; due diligence means continuously checking that they work. If a state must not knowingly allow its territory to be used for cyber operations, it will expect organisations inside it not to let their systems become launch points or transit nodes, for example as botnet zombies or compromised servers. This strengthens the organisation's own due care: patch and harden servers and IoT devices, monitor outbound traffic, report incidents and cooperate with NSM and CERTs. Failing to do so can create legal liability and reputational damage." },
    { t:"ch2", k:"mc",
      q:"Within how many hours must a personal data breach normally be reported to the supervisory authority (Datatilsynet) under GDPR?",
      o:["72 hours", "24 hours", "48 hours", "7 days"], a:0,
      e:"Report within 72 hours; inform affected persons if the risk to them is high." },
    { t:"ch2", k:"def",
      q:"Which GDPR role decides why and how personal data is processed (e.g. the hospital), as opposed to the cloud provider that processes data on its behalf?",
      o:["Data processor", "Data controller", "Data protection officer", "Data subject"], a:1,
      e:"Controller decides; processor processes for the controller. A data processing agreement is required." },
    { t:"ch2", k:"def",
      q:"Which risk assessment does GDPR require before high-risk processing of personal data?",
      o:["BIA (Business Impact Analysis)", "TVA (threats–vulnerabilities–assets) worksheet", "DPIA (Data Protection Impact Assessment)", "FAIR (Factor Analysis of Information Risk)"], a:2,
      e:"A DPIA assesses privacy risks before processing starts." },
    { t:"ch2", k:"mc",
      q:"Which list contains GDPR Art. 5 principles?",
      o:["Least privilege, need to know, separation of duties", "Confidentiality, integrity, availability only", "Deterrence, detection, recovery", "Data minimisation, purpose limitation, storage limitation, accountability"], a:3,
      e:"Also: lawfulness/fairness/transparency, accuracy, integrity and confidentiality." },
    { t:"ch2", k:"mc",
      q:"How do law, ethics and policy differ?",
      o:["Law is enforced by the state with penalties; ethics are accepted norms of right and wrong; policies are organisational 'laws' in between", "They are the same: all three are rules enforced by the state with penalties", "Ethics are always written into law, and policies are only recommendations", "Policies override laws, so an organisation can ignore laws that conflict with them"], a:0,
      e:"Laws set the minimum; ethics describe what you should do; policy must not conflict with law." },
    { t:"ch2", k:"essay", x:"E22-Q6, E23-Q4",
      q:"Unethical behaviour can be difficult to deter. What are the general categories of unethical behaviour, and how can they be prevented? Exemplify.",
      kp:["Three causes: ignorance, accident, intent","Ignorance → education, training, clear policy (e.g. pirated software)","Accident → controls, least privilege, backups, change management (e.g. deleted database)","Intent → deterrence: monitoring, sanctions, legal action (e.g. selling customer data)","Deterrence needs fear of penalty, probability of being caught, penalty actually applied","Codes of ethics (ACM, ISC2) support professional behaviour"],
      m:"W&M sort causes into three groups. Ignorance: people do not know the rules, e.g. a new hire installs pirated software. Prevent with SETA and a clear acceptable-use policy. Accident: honest mistakes by people with access, e.g. an admin deletes a production database. Prevent with least privilege, backups and change management. Intent: deliberate wrongdoing, e.g. an employee sells customer data. Prevent with deterrence: log access, tell staff it is logged, and actually apply sanctions. Deterrence only works with fear of the penalty, a high chance of being caught and a high chance the penalty is applied." },

    /* ---------- Ch3 Strategy ---------- */
    { t:"ch3", k:"mc",
      q:"What is the correct order from top to bottom?",
      o:["Objectives → goals → strategy → vision", "Policy → strategy → mission", "Mission → vision → values → strategy → goals → objectives", "Goals → mission → procedures"], a:2,
      e:"Strategy is derived from mission, vision and values, then broken into goals and measurable objectives." },
    { t:"ch3", k:"mc",
      q:"Which planning level has a 3–5 year horizon and is owned by the board, CEO and CISO?",
      o:["Operational", "Tactical", "Contingency", "Strategic"], a:3,
      e:"Strategic (3–5 years) → tactical (1–3 years, middle managers) → operational (days–months)." },
    { t:"ch3", k:"mc",
      q:"Why does top-down implementation of a security strategy usually succeed better than bottom-up?",
      o:["It has management authority, funding and ownership", "It is cheaper", "It needs no planning", "Technical staff dislike bottom-up"], a:0,
      e:"Bottom-up efforts often fail due to lack of authority and budget." },
    { t:"ch3", k:"def",
      q:"Which term matches: 'The responsibilities and practices of the board and executive management to give strategic direction, ensure objectives are met, manage risk and use resources responsibly'?",
      o:["Security maintenance", "Information security governance", "Benchmarking", "Incident response"], a:1,
      e:"GRC links governance, risk management and compliance." },
    { t:"ch3", k:"mc", x:"E22-Q1, R20-Q1",
      q:"Norway's National Cyber Security Strategy (2019) is a useful operative example. What is its vision?",
      o:["Norway shall have the world's largest SOC", "All companies shall be ISO 27001 certified", "In Norway, it is safe to use digital services", "No cyber attacks by 2030"], a:2,
      e:"It has five strategic goals and principles such as public–private and civil–military cooperation." },
    { t:"ch3", k:"def",
      q:"The SecSDLC phases are…",
      o:["Identify → protect → detect → respond → recover", "Plan → do → check → act", "Preparation → detection → containment → recovery", "Investigation → analysis → logical design → physical design → implementation → maintenance and change"], a:3,
      e:"SecSDLC is a formal, waterfall-based method to build a security program." },
    { t:"ch3", k:"essay", x:"R20-Q1 (60%), E22-Q1 (60%)",
      q:"Elaborate on information security strategy with an operative example. You are responsible for strategy development: propose the overall tasks (e.g. 8 strategy elements) and an implementation plan.",
      kp:["Define strategy: long-term direction from mission, vision, values (strategic planning)","Operative example: Norway's National Cyber Security Strategy (vision, 5 goals, principles, measures)","8 elements: alignment, governance/roles, risk-based approach, goals/objectives, policy framework, people/culture (SETA), technology/architecture, resilience and follow-up","Planning levels: strategic → tactical → operational","Implementation: top-management approval and budget, gap/maturity analysis, prioritise by risk and cost-benefit, roadmap, owners and deadlines, communicate and train, implement stepwise (SecSDLC), measure with KPIs/balanced scorecard, yearly review (PDCA)","Discuss challenges: culture, resources, top-down support"],
      m:"A security strategy sets the long-term direction for protecting information assets, derived from the organisation's mission, vision and values. Norway's National Cyber Security Strategy is a good example: its vision is safe use of digital services, it has five goals (secure digitalisation, robust infrastructure, competence, detection and handling, police capability), guiding principles (public–private, civil–military, international) and measures assigned to ministries. For my organisation I would build eight elements: (1) alignment with mission and values, (2) governance and clear roles with a CISO mandate, (3) a risk-based approach with asset classification and gap analysis, (4) strategic goals and SMART objectives, (5) a policy framework (EISP, ISSP, SysSP) aligned with GDPR, Security Act and NIS2, (6) people and culture through SETA, (7) technology and architecture based on ISO 27001/NSM and defence in depth, (8) resilience and follow-up: IR/contingency plans, metrics, maintenance and yearly review. Implementation: get top-management approval and budget; analyse current state; prioritise by risk and cost-benefit; make a short/medium/long-term roadmap; assign owners and deadlines; communicate and train; implement step by step as projects; measure with KPIs or a balanced scorecard and review yearly (PDCA)." },
    { t:"ch3", k:"essay", x:"R22-Q4",
      q:"Before working on policy, the information security strategy should be in place. What would be a good implementation plan for the strategy?",
      kp:["Top-management approval and budget (top-down)","Current-state and gap analysis (maturity, risk)","Prioritise by risk and cost-benefit","Roadmap: short, medium, long term","Owners, resources, deadlines","Communicate and train","Implement stepwise as projects","Measure (KPIs, balanced scorecard) and review yearly"],
      m:"1) Secure top-management approval and budget. 2) Analyse current state and gaps with a maturity check and risk assessment. 3) Prioritise measures by risk and cost-benefit. 4) Make a roadmap that breaks the strategy into tactical and operational plans. 5) Assign owners, resources and deadlines. 6) Communicate to stakeholders and train staff. 7) Implement step by step as projects. 8) Measure with KPIs or a balanced scorecard and review yearly in a PDCA cycle." },

    /* ---------- Ch4 Policy ---------- */
    { t:"ch4", k:"mc",
      q:"Which order goes from most general to most detailed?",
      o:["Procedure → policy → standard", "Standard → policy → procedure", "Policy → standard → guideline/procedure", "Guideline → policy → standard"], a:2,
      e:"Policy (what, mandatory) → standard (specific requirement) → guideline (advice) / procedure (step-by-step how)." },
    { t:"ch4", k:"case",
      q:"'Passwords must be at least 14 characters.' This is a…",
      o:["Policy", "Guideline", "Practice", "Standard"], a:3,
      e:"A standard is a detailed, mandatory requirement that supports a policy." },
    { t:"ch4", k:"case", x:"E21-Q1",
      q:"An acceptable-use policy for email and internet is an example of which policy type?",
      o:["ISSP", "EISP", "SysSP", "ACL"], a:0,
      e:"ISSP covers one issue or technology and how employees must use it." },
    { t:"ch4", k:"case", x:"E21-Q1",
      q:"A firewall rule set for the payroll server is an example of which policy type?",
      o:["EISP", "SysSP", "ISSP", "Guideline"], a:1,
      e:"SysSP: managerial guidance plus technical specifications (ACLs, configuration rules) for one system." },
    { t:"ch4", k:"def", x:"E21-Q1",
      q:"Which policy is the top-level, organisation-wide policy that sets strategic direction, scope and tone for all security efforts?",
      o:["ISSP", "SysSP", "EISP", "BCP"], a:2,
      e:"Enterprise Information Security Policy, also called the general security policy." },
    { t:"ch4", k:"mc", x:"E20-Q1, R21-Q2",
      q:"For a policy to be enforceable it must be…",
      o:["Long, technical and kept secret, so that attackers cannot read it", "Approved by the IT department only, without involving management", "Written in English and stored on the intranet, with no need for signatures", "Disseminated, reviewed (read), comprehended, complied with (agreed), and uniformly enforced"], a:3,
      e:"W&M's criteria. Example: intranet + onboarding, short quiz, signed agreement, same rules for managers." },
    { t:"ch4", k:"def",
      q:"In the bull's-eye model, which layer is the outer foundation that gives direction to all technical controls?",
      o:["Policy", "Applications", "Systems", "Networks"], a:0,
      e:"Policy → networks → systems → applications. Without policy, controls have no direction." },
    { t:"ch4", k:"mc",
      q:"What is the difference between an ACL and a capability table?",
      o:["ACL is attached to an object listing which users can access it; a capability table is attached to a user listing which objects they can access", "A capability table is attached to an object; an ACL is attached to a user and lists their objects", "They are identical: both are lists of user passwords stored on the server", "An ACL is only used in firewalls; a capability table is only used in databases"], a:0,
      e:"Both are part of SysSP technical specifications." },
    { t:"ch4", k:"essay", x:"E20-Q1 (60%), E21-Q1 (60%), R21-Q2, E22-Q3, R22-Q3",
      q:"Elaborate on information security policy. You are responsible for the policy in the organisation you are hired in: what are the overall tasks to make a good policy, and how would you implement it?",
      kp:["Define policy, standard, guideline, procedure; bull's-eye model (policy as foundation)","Three types: EISP, ISSP, SysSP with examples","Tasks: strategy first and risk-based; top-management mandate; team with IT/HR/legal/DPO; map laws (GDPR, Security Act, NIS2) and standards (ISO 27001/27002, NSM); write EISP then ISSPs and SysSPs; short, clear, enforceable; approval; policy owner and review schedule","Enforceability criteria: disseminated, reviewed, comprehended, complied with, uniformly enforced","Implementation: distribute, train and quiz, sign/agree, enforce uniformly, support with procedures, measure (audits, metrics), review yearly and after incidents","Operative example (e.g. a real policy or Østre Toten lessons)"],
      m:"A policy is a set of management rules for required and forbidden behaviour. It is the foundation in the bull's-eye model, supported by standards, guidelines and procedures. W&M define three types: the EISP (organisation-wide direction), ISSPs (one issue, e.g. acceptable use of email, BYOD, AI tools) and SysSPs (one system, e.g. firewall rules, ACLs). My tasks: make sure the strategy exists and do a risk assessment first; get a top-management mandate; form a team with IT, HR, legal, the DPO and users; map laws (GDPR, Security Act, NIS2) and standards (ISO 27001/27002, NSM basic principles); write the EISP first, then ISSPs and SysSPs; keep them short and enforceable with roles and sanctions; get approval; appoint a policy owner and review schedule. Implementation follows the enforceability criteria: disseminate via intranet and onboarding, make sure people read and understand it (training, quiz), get agreement (sign/click), enforce uniformly including managers, support with procedures and a help desk, measure with audits and metrics, and review yearly and after incidents or new laws." },

    /* ---------- Research based learning ---------- */
    { t:"rbl", k:"def",
      q:"In academic writing (RBL slides), 'outlining an argument from what you know, then researching to fill the gaps' is which mode?",
      o:["Induction", "Abduction", "Triangulation", "Deduction"], a:3,
      e:"Deduction = finding data to support an argument (active reading). The slides call it the best in practice." },
    { t:"rbl", k:"def",
      q:"'Researching the topic first, then forming an argument from the research' is which mode?",
      o:["Induction", "Deduction", "Abduction", "Delphi"], a:0,
      e:"Induction is the most common but less effective mode: you risk over-reading and losing your own voice." },
    { t:"rbl", k:"def",
      q:"'Making clear the assumptions (warrant) that let you move from data to argument' is which mode?",
      o:["Deduction", "Abduction", "Induction", "Benchmarking"], a:1,
      e:"Abduction deepens critique by questioning underlying assumptions." },
    { t:"rbl", k:"mc",
      q:"According to the course's review guide, which parts does the examiner read first and use to form an overall impression?",
      o:["References and appendices", "Figures only", "Abstract and conclusions", "The background section"], a:2,
      e:"Abstract and conclusions must be written with much more care than the rest." },

    /* ---------- Ch5 Program & people ---------- */
    { t:"ch5", k:"mc",
      q:"Why is it often better for the security function to report outside the IT department?",
      o:["It is cheaper", "IT does not understand security", "Laws require it", "It reduces conflicts of interest: IT wants speed, security wants control"], a:3,
      e:"Placement options: under CIO, own department under CEO, legal, risk management, admin services." },
    { t:"ch5", k:"def",
      q:"In W&M, security staff are grouped as definers, builders and administrators. Who are the definers?",
      o:["Policy and risk people such as the CISO and managers","Engineers who implement controls","Operators who monitor daily","External auditors"], a:0,
      e:"Builders design and implement; administrators operate and monitor." },
    { t:"ch5", k:"mc", x:"R20-Q3, E23-Q3",
      q:"Match SETA parts to their goal.",
      o:["Awareness = why; training = what; education = how", "Awareness = what (recognise threats); training = how (job skills); education = why (deep understanding)", "All three are the same", "Education is for all employees"], a:1,
      e:"Awareness for everyone (posters, phishing tests); training for staff with security tasks; education for security professionals." },
    { t:"ch5", k:"case",
      q:"An employee locks the screen because they think it matters, colleagues do it, and it is easy. Which theory explains this?",
      o:["General Deterrence Theory", "Dynamic capability theory", "Theory of Planned Behaviour", "Chinese Wall"], a:2,
      e:"TPB: attitude, subjective norms and perceived behavioural control shape intention and behaviour." },
    { t:"ch5", k:"def",
      q:"Which theory says people protect themselves when they see a serious, likely threat AND believe they can carry out an effective protective action?",
      o:["General Deterrence Theory", "Theory of Planned Behaviour", "Schein's culture model", "Protection Motivation Theory"], a:3,
      e:"PMT: threat appraisal + coping appraisal." },
    { t:"ch5", k:"mc",
      q:"Schein describes organisational culture in three levels. Which?",
      o:["Artifacts, espoused values, basic assumptions","Policy, standard, procedure","Strategic, tactical, operational","Awareness, training, education"], a:0,
      e:"Basic assumptions are what people really take for granted when nobody is watching." },
    { t:"ch5", k:"mc", x:"E21-Q6",
      q:"Which type of trust in information sharing is the highest level, based on shared values and goals?",
      o:["Calculus-based trust", "Identification-based trust", "Knowledge-based trust", "Contract-based trust"], a:1,
      e:"Calculus-based (rules, contracts) → knowledge-based (past behaviour) → identification-based (shared values)." },
    { t:"ch5", k:"def", x:"E21-Q6",
      q:"Information labelled TLP:AMBER may be shared…",
      o:["Publicly","With the whole community","Within the recipient's own organisation on a need-to-know basis","Only with the named recipients"], a:2,
      e:"RED = named recipients, AMBER = own organisation need-to-know, GREEN = community, CLEAR = public." },
    { t:"ch5", k:"essay", x:"E21-Q6",
      q:"Trust in information sharing is paramount. Which type of trust is important, why, and how can you generate a higher level of trust?",
      kp:["Calculus-based (rules, contracts, sanctions) → knowledge-based (past behaviour) → identification-based (shared values, highest)","Why: organisations only share threat information with partners they trust; sharing improves external monitoring and response","Raise trust: clear rules (TLP, NDAs), reciprocity, regular meetings and exercises","Secure platforms (MISP, PGP), published service descriptions (RFC 2350)","Track record of handling shared data well"],
      m:"Trust grows in three levels: calculus-based trust rests on rules, contracts and sanctions; knowledge-based trust on knowing the partner's past behaviour; identification-based trust on shared values and goals, which is the level that makes sharing easy. It matters because CERTs, partners and sectors only share sensitive threat information if they trust how it will be used. To raise trust I would agree clear rules such as TLP and NDAs, share reciprocally, meet and exercise regularly, use secure platforms like MISP and PGP, publish an RFC 2350 service description, and build a track record of handling shared data well." },
    { t:"ch5", k:"mc",
      q:"Why are job rotation and mandatory vacation used in personnel security?",
      o:["So fraud or errors become visible when someone else does the job", "To save money", "To reduce training costs", "To comply with GDPR"], a:0,
      e:"They are controls during employment, alongside least privilege and separation of duties." },
    { t:"ch5", k:"essay", x:"E21-Q3",
      q:"What information security positions would you as a manager consider important, and how would you argue to get them approved?",
      kp:["Positions: CISO, security manager, architect, engineer, SOC analyst, incident responder, DPO, awareness coordinator","Roles: definers, builders, administrators; data owner/custodian/user","Business case: risk assessment shows exposure","Cost of likely incident vs salary","Legal requirements (GDPR, NIS2, Security Act)","Benchmarking and past incidents (e.g. Østre Toten)","Clear KPIs the role will deliver"],
      m:"Key positions: a CISO for strategy, policy and reporting to top management; a security manager for the daily program; architects and engineers who build and maintain controls; SOC analysts and incident responders; a DPO for GDPR; and an awareness coordinator for SETA. To get them approved I would build a business case: show the risk assessment and expected loss (e.g. ALE) compared to the salary cost, point to legal duties such as GDPR, NIS2 and the Security Act, benchmark against similar organisations, use real incidents like Østre Toten 2021, and promise measurable KPIs." },
    { t:"ch5", k:"essay", x:"R20-Q3, E23-Q3, R21-Q3",
      q:"Cyber attacks are increasing and more educated security personnel are needed. How would you meet these challenges (SETA / security program) in the organisation you are hired in?",
      kp:["Assess needs: roles, current skills, risk areas","Awareness for everyone: onboarding, yearly, phishing simulations","Role-based training for IT, developers, managers","Education and certifications for the security team (CISSP, CISM, master's)","Exercises (tabletop, crisis drills) with management","Measure effect (click rates, incidents, quizzes) and adjust","Recruit and retain: career paths, university partnerships","Link to strategy, risk assessment and program placement"],
      m:"I would start with a needs assessment of roles, skills and risk areas. Then run SETA in three layers: awareness for all employees (onboarding, yearly refreshers, phishing simulations), role-based training for IT, developers and managers, and education and certifications for the security team. Add tabletop and crisis exercises that include top management. Measure the effect through click rates, incident numbers and quizzes, and adjust. Finally, recruit and keep people with career paths and university partnerships, and anchor everything in the strategy and risk assessment." },

    /* ---------- Ch6 Risk assessment ---------- */
    { t:"ch6", k:"mc",
      q:"Risk assessment consists of…",
      o:["Defence, transference, mitigation", "Detection, reaction, recovery", "Planning, organising, leading", "Risk identification, risk analysis, risk evaluation"], a:3,
      e:"Risk management = context → identify → analyse → evaluate → treat → monitor, with communication throughout." },
    { t:"ch6", k:"mc", x:"R20-Q2",
      q:"What is the difference between asset classification and asset categorisation?",
      o:["Classification labels sensitivity (public, internal, confidential, secret); categorisation rates impact on C, I, A (low/moderate/high)", "Categorisation labels sensitivity (public to secret); classification rates impact on C, I, A", "They are the same: both put a money value on each asset", "Classification is only for hardware; categorisation is only for software"], a:0,
      e:"FIPS 199: overall category = highest of the three CIA ratings." },
    { t:"ch6", k:"mc", x:"R20-Q2",
      q:"Which question is one of W&M's asset valuation questions?",
      o:["Which asset is the newest, or was bought most recently by the IT department?", "Which asset generates the most revenue, or would be most expensive to replace or most embarrassing if revealed?", "Which asset is used by the CEO, or is located in the main office?", "Which asset has the most users, or the longest name in the inventory?"], a:1,
      e:"Also: which asset is most critical to the organisation's success?" },
    { t:"ch6", k:"mc",
      q:"An asset is worth 200,000 NOK, 50% is damaged per incident, and incidents happen twice per year. What is the ALE?",
      o:["100,000 NOK", "400,000 NOK", "200,000 NOK", "50,000 NOK"], a:2,
      e:"SLE = 200,000 × 0.5 = 100,000. ALE = SLE × ARO = 100,000 × 2 = 200,000 NOK/year." },
    { t:"ch6", k:"def", x:"R20-Q2",
      q:"Which tool is a likelihood × impact grid, coloured green/yellow/red, used to present risks to management?",
      o:["TVA worksheet", "Attack tree", "Balanced scorecard", "Risk matrix (heat map)"], a:3,
      e:"Weighted table analysis helps rank assets; the risk matrix presents the results." },
    { t:"ch6", k:"def",
      q:"Which risk method expresses risk in money (loss event frequency × loss magnitude) and is good for board communication?",
      o:["FAIR","OCTAVE","Delphi","STRIDE"], a:0,
      e:"FAIR is quantitative. OCTAVE is a qualitative, workshop-based, self-directed method." },
    { t:"ch6", k:"def",
      q:"Which method has experts rate risks anonymously in rounds until they agree, useful when there is little data?",
      o:["FAIR", "Delphi technique", "ISO 27005", "ALE"], a:1,
      e:"Good for new threats where historic data is missing." },
    { t:"ch6", k:"case", x:"E20-Q2, R21-Q1, E23-Q5",
      q:"A municipality uses a general risk and resilience (ROS) template that treats cyber like a power outage. What should it add?",
      o:["Nothing: a general ROS template already covers cyber attacks well enough", "Only more firewalls and antivirus, since cyber risk is a purely technical problem", "An InfoSec-specific method (ISO 27005 or OCTAVE), a socio-technical analysis, threat intelligence (MITRE ATT&CK, NSM/PST), and FAIR for cost", "A bigger insurance policy, so that all cyber risk is transferred to the insurer"], a:2,
      e:"Cyber attacks need their own place in the risk register (lesson from Østre Toten)." },
    { t:"ch6", k:"mc",
      q:"Which STRIDE threat violates integrity?",
      o:["Spoofing", "Repudiation", "Denial of service", "Tampering"], a:3,
      e:"Spoofing–authentication, Tampering–integrity, Repudiation–non-repudiation, Information disclosure–confidentiality, DoS–availability, Elevation–authorisation." },
    { t:"ch6", k:"mc",
      q:"Threat, vulnerability and risk — which pairing is correct?",
      o:["Threat = ransomware gang; vulnerability = no MFA on remote access; risk = likelihood × impact","Threat = no MFA; vulnerability = ransomware gang","Risk = the attacker","Vulnerability = the consequence"], a:0,
      e:"A threat exploits a vulnerability, causing an incident and consequences." },
    { t:"ch6", k:"essay", x:"R21-Q1 (60%), E20-Q2, R22-Q2, E22-Q4, E23-Q5",
      q:"Your organisation's risk management process leaves out several information security issues. Which InfoSec risk analysis method(s) would you use to improve it, and why? Then, why and how would you choose feasible risk treatments?",
      kp:["Why general ROS templates are incomplete for cyber","Methods: ISO/IEC 27005, NIST SP 800-30, OCTAVE (Allegro), FAIR, Delphi, DSB ROS, socio-technical analysis","When to use each (ISO users, public sector, internal workshops, board communication, little data)","Asset classification/categorisation, TVA, risk matrix","Threat input: MITRE ATT&CK, NSM/PST/ENISA threat assessments","Treatments: defence, transference, mitigation, acceptance, termination with examples","Feasibility: economic (CBA), organisational, operational, technical, political","Residual risk, risk appetite, monitoring"],
      m:"General ROS templates (like DSB's for municipalities) treat cyber like any other hazard and miss assets, threat actors and human factors. I would add ISO/IEC 27005 (fits an ISO 27001 ISMS) or OCTAVE Allegro (internal, asset-focused workshops), a socio-technical analysis for culture and awareness (Østre Toten had a technical analysis but missed these), MITRE ATT&CK and NSM/PST threat assessments for realistic threats, and FAIR to express risk in money to management. Delphi helps when data is scarce. Start by classifying and categorising assets, build a TVA worksheet and show results in a risk matrix. Then treat the risks, because resources are limited and not all risks can be removed: defence (patching, MFA), transference (insurance, outsourcing), mitigation (IR, DR plans, backups), acceptance (low-value assets) or termination (shut down a legacy service). Check feasibility: cost-benefit (ALE before − ALE after − cost), organisational fit, user acceptance, technical fit and political support. Document residual risk against the risk appetite and monitor continuously." },
    { t:"ch6", k:"essay", x:"R20-Q2",
      q:"You are classifying and categorising information assets but do not know their value or how to prioritise. How would you move forward, and which impact and risk matrices would you use to present the result to management?",
      kp:["Inventory assets with owners","Classification by sensitivity (open, internal, confidential, strictly confidential)","Categorisation by CIA impact (FIPS 199 low/moderate/high, highest wins)","W&M valuation questions (critical, revenue, replacement cost, embarrassment/liability)","Weighted table analysis with weighted criteria","Present with impact table and 5×5 likelihood × impact heat map"],
      m:"First build an asset inventory with owners. Classify each asset by sensitivity (open, internal, confidential, strictly confidential) and categorise by the impact on confidentiality, integrity and availability (low/moderate/high, overall = highest). Value assets with W&M's questions: which is most critical, earns most, costs most to replace, or would be most embarrassing or create liability if revealed. Rank them in a weighted table analysis (e.g. revenue 30%, reputation 40%, legal 30%). Present to management with an impact table per asset and a 5×5 likelihood × impact heat map in green, yellow and red." },

    /* ---------- Ch7 Risk treatment ---------- */
    { t:"ch7", k:"case", x:"R21-Q1",
      q:"Buying cyber insurance is which risk treatment strategy?",
      o:["Defence", "Mitigation", "Acceptance", "Transference"], a:3,
      e:"Transference shifts risk to others (insurance, outsourcing)." },
    { t:"ch7", k:"case", x:"R21-Q1",
      q:"Having an IR plan, DR plan and backups to reduce damage if an incident happens is which strategy?",
      o:["Mitigation", "Defence", "Transference", "Termination"], a:0,
      e:"Mitigation reduces impact. Defence (avoidance) prevents exploitation, e.g. patching and MFA." },
    { t:"ch7", k:"case",
      q:"Shutting down an old, unsupported web service is which strategy?",
      o:["Acceptance","Termination","Transference","Defence"], a:1,
      e:"Termination removes the risky activity or asset." },
    { t:"ch7", k:"mc",
      q:"Cost-benefit analysis: ALE before = 200,000, ALE after = 40,000, annual cost of control = 60,000. What is the CBA?",
      o:["160,000 NOK", "−20,000 NOK – not worth it", "100,000 NOK – worth it", "300,000 NOK"], a:2,
      e:"CBA = ALE before − ALE after − annual cost = 200,000 − 40,000 − 60,000 = 100,000." },
    { t:"ch7", k:"mc", x:"R21-Q1",
      q:"Which feasibility areas should you check before choosing a control?",
      o:["Only cost", "Only technical fit", "Legal and colour of the product", "Economic (cost-benefit), organisational, operational/behavioural, technical, political"], a:3,
      e:"A control that is too expensive, rejected by users or unsupported by management will fail." },
    { t:"ch7", k:"def",
      q:"Which term matches: 'The risk that remains after controls are applied'?",
      o:["Residual risk","Risk appetite","Inherent risk tolerance","ARO"], a:0,
      e:"Residual risk is compared with the risk appetite (how much risk the organisation will accept)." },
    { t:"ch11", k:"def",
      q:"Which model goes: causes → preventive measures → unwanted event → damage-limiting measures → consequences?",
      o:["Bull's-eye model", "Bow-tie model (DSB risk process)", "McCumber Cube", "Kill chain"], a:1,
      e:"The Ch 11 slides show the DSB bow-tie with preparedness and crisis plans on the consequence side." },

    /* ---------- Ch8 Models ---------- */
    { t:"ch8", k:"mc", x:"E23-Q1",
      q:"Which management framework is certifiable?",
      o:["NIST CSF", "NSM Basic Principles", "ISO/IEC 27001", "CIS Controls"], a:2,
      e:"ISO 27001 = ISMS requirements, certifiable. NIST CSF and NSM are voluntary, not certifiable." },
    { t:"ch8", k:"mc", x:"E23-Q1, E20-Q6",
      q:"What are the six functions of NIST CSF 2.0?",
      o:["Plan, Do, Check, Act, Review, Improve", "Identify, Protect, Detect, Respond, Recover, Report", "Assess, Design, Build, Test, Deploy, Maintain", "Govern, Identify, Protect, Detect, Respond, Recover"], a:3,
      e:"CSF also has implementation tiers (1 Partial → 4 Adaptive) and current/target profiles." },
    { t:"ch8", k:"mc",
      q:"NSM's Basic Principles for ICT Security are organised in four categories. Which?",
      o:["Identify and map → Protect and maintain → Detect → Handle and recover","Govern → Identify → Protect → Recover","Plan → Do → Check → Act","Assess → Treat → Accept → Monitor"], a:0,
      e:"A Norwegian, practical framework, free and suited for gap analysis." },
    { t:"ch8", k:"case", x:"E23-Q1",
      q:"Which architecture model enforces 'no read up, no write down' to protect confidentiality?",
      o:["Biba", "Bell-LaPadula", "Clark-Wilson", "Brewer-Nash"], a:1,
      e:"BLP uses classifications and clearances (MAC). Biba is the integrity mirror: no read down, no write up." },
    { t:"ch8", k:"case", x:"E23-Q1",
      q:"A consultant working for Bank A must not see Bank B's files. Which model?",
      o:["Biba", "Bell-LaPadula", "Brewer-Nash (Chinese Wall)", "Graham-Denning"], a:2,
      e:"Chinese Wall prevents conflicts of interest based on what the subject has already accessed." },
    { t:"ch8", k:"def", x:"E23-Q1",
      q:"Which integrity model lets users change data only through controlled programs (access triple subject → program → object), with well-formed transactions and separation of duties?",
      o:["Biba", "Bell-LaPadula", "HRU", "Clark-Wilson"], a:3,
      e:"Clark-Wilson fits commercial business processes." },
    { t:"ch8", k:"def",
      q:"Which international standard certifies security products using Target of Evaluation, Protection Profiles and EAL1–7?",
      o:["Common Criteria (ISO/IEC 15408)", "ISO/IEC 27001 (ISMS requirements)", "TCSEC (the “Orange Book”)", "COBIT (IT governance framework)"], a:0,
      e:"Common Criteria replaced TCSEC (Orange Book) and ITSEC." },
    { t:"ch8", k:"mc", x:"E23-Q1",
      q:"How do management models and architecture models differ?",
      o:["Management models (ISO 27001, NIST CSF, NSM) say WHAT to manage at organisation level; architecture models (BLP, Biba, Clark-Wilson, CC) say HOW systems enforce access", "Architecture models say WHAT to manage at organisation level; management models say HOW systems enforce access", "They are the same: both are certification schemes for security products", "Management models are purely technical; architecture models are for top management only"], a:0,
      e:"They complement each other: management sets requirements, architecture implements them." },
    { t:"ch8", k:"mc", x:"E20-Q3",
      q:"File permissions and database rights on individual records are which type of access control?",
      o:["Physical", "Logical", "Data", "System"], a:2,
      e:"Physical = buildings/locks, logical = networks via software (firewall, VPN), system = OS/application accounts, data = files and records." },
    { t:"ch8", k:"essay", x:"E20-Q3",
      q:"What is the difference between physical, logical, system and data access control? How would you combine them and why? Exemplify.",
      kp:["Physical: buildings, rooms, hardware (key cards, guards)","Logical: networks and resources via software (firewalls, VPN, passwords)","System: OS and application accounts and privileges","Data: individual files, records, fields (permissions, encryption)","Combine in layers = defence in depth","Principles: least privilege, need to know, separation of duties"],
      m:"Physical access control protects buildings and hardware (key cards, locks, guards). Logical access control protects networks and resources through software (firewalls, VPN, passwords). System access control governs operating systems and applications (user accounts, privileges). Data access control protects individual files and records (permissions, encryption, DB rights). I would combine them in layers so an attacker must pass the door, the network, the system login and the data permissions (defence in depth), all based on least privilege and need to know. Example: a hospital uses key cards to the server room, VPN with MFA, role-based accounts in the journal system, and record-level access logging." },
    { t:"ch8", k:"essay", x:"E23-Q1 (60%)",
      q:"Discuss and compare 3 security management frameworks; discuss architectural models with positives and negatives; position management vs architecture models via properties.",
      kp:["ISO/IEC 27001/27002: international, ISMS + 93 controls, certifiable; strong recognition but costly","NIST CSF 2.0: 6 functions, tiers, profiles; free, flexible, good for maturity; not certifiable, US-oriented","NSM Basic Principles: Norwegian, 4 categories, concrete; less known internationally","Architecture: BLP (confidentiality, rigid), Biba (integrity, ignores confidentiality), Clark-Wilson (business integrity, complex), Brewer-Nash (conflict of interest, narrow), Common Criteria (product certification, slow/expensive)","Positioning table: level, question answered, audience, focus, output","They complement each other"],
      m:"ISO/IEC 27001/27002 is an international, certifiable ISMS with 93 controls in four themes; it is globally recognised but costly and documentation-heavy. NIST CSF 2.0 has six functions (Govern, Identify, Protect, Detect, Respond, Recover), tiers and profiles; it is free and easy to explain to management, but not certifiable. NSM Basic Principles are Norwegian, practical and free, in four categories, but less known abroad. Architecture models: Bell-LaPadula protects confidentiality (no read up, no write down) but ignores integrity; Biba protects integrity but ignores confidentiality; Clark-Wilson fits business processes with separation of duties but is complex; Brewer-Nash prevents conflicts of interest but has a narrow use case; Common Criteria certifies products internationally but is slow and expensive. Positioning: management models work at organisation level, answer 'what should we manage', target CISOs and auditors and produce an ISMS and maturity levels; architecture models work at system level, answer 'how is access enforced', target architects and evaluators and produce access rules and certified products. They complement each other." },

    /* ---------- Ch9 Practices ---------- */
    { t:"ch9", k:"def",
      q:"Which term matches: 'Comparing your security practices with other organisations or standards'?",
      o:["Baselining", "Benchmarking", "Gap analysis", "Penetration testing"], a:1,
      e:"Baselining measures your own current level; gap analysis compares current vs target." },
    { t:"ch9", k:"mc", x:"E20-Q6",
      q:"Which list contains maturity models?",
      o:["STRIDE, DREAD, PASTA", "GDPR, NIS2, Security Act", "CMMI, NIST CSF tiers, C2M2, SSE-CMM", "TLP, BLUF, IMRaD"], a:2,
      e:"CMMI levels: 1 Initial, 2 Managed, 3 Defined, 4 Quantitatively managed, 5 Optimizing." },
    { t:"ch9", k:"mc", x:"E20-Q6",
      q:"How can a maturity investigation improve security, as in the University of Chicago BSD NIST example?",
      o:["Buy the highest tier product", "Skip measurement and implement everything", "Only measure once", "Measure baseline → set target per area → show gaps in a heat map → prioritise → re-measure"], a:3,
      e:"Improve 'one step at a time' and re-measure yearly or after exercises." },
    { t:"ch9", k:"mc", x:"R22-Q5, E23-Q6",
      q:"Which pairing of CSIRT, CERT and SOC is correct?",
      o:["SOC monitors and triages alerts 24/7; CSIRT handles incidents; CERT coordinates and warns a sector or nation","SOC only writes policy","CERT only exists inside one company","CSIRT monitors, SOC coordinates nationally"], a:0,
      e:"Examples: Telenor SOC, an internal NTNU incident team, NorCERT/HelseCERT/KraftCERT." },
    { t:"ch9", k:"def",
      q:"Which RFC describes what a CSIRT should publish about itself (contacts, services, PGP keys, hours)?",
      o:["RFC 3971", "RFC 2350", "RFC 2671", "RFC 7350"], a:1,
      e:"Publishing a service description also builds trust for information sharing." },
    { t:"ch9", k:"essay", x:"R22-Q5, E23-Q6",
      q:"What are the differences between a CSIRT, a CERT and a SOC, and how would an organisation benefit from them?",
      kp:["SOC: continuous monitoring, detection and triage (SIEM), proactive","CSIRT: incident response – isolate, mitigate, recover; reactive + advisories","CERT: coordinates, warns and promotes best practice for a sector or nation","Examples (Telenor SOC, NorCERT, HelseCERT, KraftCERT)","Benefits: faster detection/response, less damage and downtime, threat intelligence, expert help, compliance with reporting duties","SOC often hands incidents to CSIRT; terms overlap"],
      m:"A SOC monitors the organisation 24/7, detects and triages alerts with SIEM and is proactive. A CSIRT handles incidents: it isolates, mitigates and recovers, and issues advisories. A CERT coordinates and warns a whole sector or nation and promotes best practice, e.g. NorCERT, HelseCERT or KraftCERT. In practice a SOC passes confirmed incidents to the CSIRT. Benefits: faster detection and response, less damage and downtime, access to threat intelligence and sector warnings, expert help and easier compliance with reporting duties." },
    { t:"ch9", k:"essay", x:"E20-Q6",
      q:"What measurement (maturity) models do you know, and how can maturity investigations improve information security maturity in your organisation?",
      kp:["Models: CMMI, NIST CSF tiers, C2M2, SSE-CMM, Wahlgren & Kowalski","UChicago BSD example: NIST CSF + custom tiers + heat map","Baseline → target → gap → heat map → prioritise → implement → re-measure","Report to management; link to strategy and budget","Repeat yearly / after exercises"],
      m:"Known models include CMMI (five levels from Initial to Optimizing), the NIST CSF implementation tiers, C2M2 for energy, SSE-CMM and Wahlgren & Kowalski's model. Like the University of Chicago BSD, I would measure the baseline per area, set a target, show gaps in a heat map, prioritise improvements with management, implement them and re-measure yearly or after exercises, improving one step at a time." },

    /* ---------- Ch10 Contingency planning ---------- */
    { t:"ch10", k:"mc", x:"E20-Q5, R21-Q4, E22-Q5",
      q:"What are the four components of contingency planning?",
      o:["BIA, incident response plan, disaster recovery plan, business continuity plan","Risk assessment, policy, SETA, audit","Identify, protect, detect, recover","CSIRT, CERT, SOC, ISAC"], a:0,
      e:"The BIA comes first; the CPMT leads all CP work." },
    { t:"ch10", k:"mc", x:"E21-Q4, R20-Q4",
      q:"What is the main difference between an IR plan and a DR plan?",
      o:["IR stops and fixes a security incident at the primary site; DR restores systems, data and facilities after a disaster", "IR restores systems after a disaster; DR handles small incidents such as a single phishing email", "They are identical: both keep the business running at an alternate site", "DR is always used before IR, and IR runs at an alternate site"], a:0,
      e:"BC keeps critical business functions running, often at an alternate site." },
    { t:"ch10", k:"case", x:"E21-Q4, R20-Q4",
      q:"The data centre is flooded and patient systems are run from a backup hospital site. Which plan is in action?",
      o:["Incident response plan","Disaster recovery plan","Business continuity plan","Policy review"], a:2,
      e:"Keeping business functions running at an alternate site is business continuity." },
    { t:"ch10", k:"def", x:"R22-Q1, R21-Q6",
      q:"Which term matches: 'The longest a process can be down before the damage is unacceptable'?",
      o:["RPO", "RTO", "WRT", "MTD"], a:3,
      e:"MTD = RTO + WRT. RPO = acceptable data loss in time (decides backup frequency)." },
    { t:"ch10", k:"mc",
      q:"RPO = 1 hour. What does this mean in practice?",
      o:["At most 1 hour of data may be lost, so back up at least hourly", "Systems must be back within 1 hour", "The plan is tested hourly", "MTD is 1 hour"], a:0,
      e:"RTO is the target time to restore; RPO is about data loss." },
    { t:"ch10", k:"mc", x:"E20-Q5, R21-Q4, E22-Q5",
      q:"What are the first steps of NIST SP 800-34 contingency planning?",
      o:["Buy backup software → write the DR plan → test it once → archive the plan", "CP policy statement → BIA → preventive controls → recovery strategies → plans → testing/training → maintenance", "Write the DR plan → write the policy → run a BIA → hire a CERT", "Hire a CERT → buy insurance → run a full interruption test → write the BIA"], a:1,
      e:"Seven steps; the life cycle keeps it continuous through reviews, exercises and lessons learned." },
    { t:"ch10", k:"def",
      q:"Which alternate site is fully equipped and ready in hours, but costly?",
      o:["Warm site", "Cold site", "Hot site", "Mutual agreement"], a:2,
      e:"Warm = partly equipped; cold = empty room with power." },
    { t:"ch10", k:"mc",
      q:"Which plan testing method is most realistic but also most risky?",
      o:["Desk check","Structured walk-through","Tabletop simulation","Full interruption"], a:3,
      e:"Order: desk check → walk-through → simulation → parallel testing → full interruption." },
    { t:"ch10", k:"essay", x:"E20-Q5, R21-Q4, E22-Q5",
      q:"You lead the contingency planning management team (CPMT). What are the proper steps to organise contingency planning, and how would you build a life cycle strategy to keep the work continuous?",
      kp:["CPMT: champion (senior executive), project manager, members from business, IT, InfoSec, HR, legal, communications; IR/DR/BC teams below","CP = BIA + IR + DR + BC","NIST SP 800-34 seven steps: policy, BIA, preventive controls, strategies, plans, testing/training/exercises, maintenance","BIA: processes, recovery criticality, MTD/RTO/RPO, resources","Life cycle: plan owner, yearly review and after incidents/changes, exercises incl. top management, lessons learned (PDCA), updated contacts/contracts","Link to risk assessment and the maintenance model"],
      m:"First I set up the CPMT with a senior champion who gives authority and budget, a project manager and members from business units, IT, InfoSec, HR, legal and communications, with IR, DR and BC teams under it. I follow NIST SP 800-34: 1) write the CP policy statement, 2) run the BIA to find critical processes, recovery criticality, MTD, RTO and RPO, 3) identify preventive controls, 4) choose recovery strategies (backups, alternate sites), 5) write the IR, DR and BC plans, 6) test, train and exercise, 7) maintain the plans. To make it continuous: assign plan owners, review at least yearly and after every incident, exercise or major change, run exercises from tabletop to full simulations with top management, feed lessons learned back into the plans (PDCA), keep contact lists and contracts current, and link CP to the risk assessment and the security maintenance model." },
    { t:"ch10", k:"essay", x:"E21-Q4, R20-Q4",
      q:"What is the difference between an incident response plan and a disaster recovery plan? Exemplify how they help during an incident.",
      kp:["IR: detect, contain, eradicate, recover from an incident at the primary site (NIST 800-61 phases)","DR: restore systems, data, facilities after a disaster","BC as the third plan (alternate site)","Example IR: phishing → compromised account: isolate PC, reset passwords, remove malware","Example DR: ransomware encrypts all servers → rebuild from offline backups","Escalation from incident to disaster"],
      m:"An IR plan handles a security incident at the primary site: preparation, detection and analysis, containment, eradication and recovery, and lessons learned. Example: a phishing email compromises an account; the IR team isolates the PC, resets passwords and removes the malware. A DR plan is used when the incident becomes a disaster that the organisation cannot contain, such as ransomware encrypting all servers; the DR team restores systems and data from offline backups. If business cannot run at the primary site meanwhile, the BC plan moves critical functions to an alternate site." },
    { t:"ch10", k:"essay", x:"E21-Q5",
      q:"What recovery criticality would you consider important in a business continuity plan?",
      kp:["BIA ranks business processes by how fast they must be restored","Levels: critical (hours), essential (days), non-essential (weeks)","Criteria: life and safety first, legal duties, revenue, customers, reputation, dependencies","Hospital example: journal and lab = critical; payroll = essential; newsletter = non-essential","Link to MTD/RTO/RPO"],
      m:"Recovery criticality comes from the BIA and ranks processes by how quickly they must be restored: critical within hours, essential within days and non-essential within weeks. Criteria are life and safety first, then legal duties, revenue, customers, reputation and dependencies between systems. In a hospital the patient journal and lab systems are critical, payroll is essential and the internal newsletter is non-essential. Each level gets MTD, RTO and RPO targets." },
    { t:"ch10", k:"essay", x:"R21-Q6, R22-Q1",
      q:"What efforts can you make to optimise maximum tolerable downtime (MTD) in dialogue with top management?",
      kp:["Run the BIA with business leaders and agree MTD per process","Translate MTD into RTO/RPO (MTD = RTO + WRT)","Invest where gaps are largest: offline/immutable backups, redundancy, alternate sites","Pre-signed contract with external incident and recovery team","Manual fallback routines","Exercise ransomware scenarios with top management","Report status and residual risk regularly"],
      m:"I would run the BIA together with business leaders so top management agrees the MTD per process, then translate it into RTO and RPO. Where there are gaps, invest in offline or immutable backups, redundancy and alternate sites, sign a contract with an external incident and recovery team in advance, and prepare manual fallback routines. Exercise ransomware scenarios with top management and report status and residual risk regularly." },

    { t:"ch11", k:"case",

    { t:"ch11", k:"mc",

    { t:"ch11", k:"def",
      q:"Which NIST publication is the 'Information Security Handbook: A Guide for Managers', listing 13 areas to maintain?",

    { t:"ch11", k:"mc",
      q:"Which was a key lesson from the Østre Toten ransomware attack (2021)?",
      o:["Municipalities need no backups, because ransomware cannot reach public systems", "Only the IT department should be informed, to keep the attack secret from the public", "Exercises are a waste of time, because every cyber attack is completely different", "Cyber attacks need their own place in the risk and vulnerability analysis, and contingency plans need a contract with an external ICT recovery team"], a:3,

    { t:"ch11", k:"mc",
      q:"Who makes strategic decisions in a crisis, as opposed to the technical IR team?",

    { t:"ch11", k:"essay", x:"E21-Q2, E22-Q2, R22-Q1 (60%), R20-Q5, R21-Q5",
      q:"Security maintenance is labour-intensive. How can you use the security maintenance model to make an optimised culture for managing and operating security over time?",
      kp:["Five areas explained with examples (external monitoring, internal monitoring, planning and risk assessment, vulnerability assessment and remediation, readiness and review)","Routine database / risk, threat and vulnerability databases","NIST SP 800-100 areas","Culture: routine not project, clear owners, reports to management","Involve people, share results, appreciative inquiry","Learning: root cause analysis, lessons learned, double-loop learning","Train and exercise incl. top management; measure maturity yearly","Share with CERTs and partners (trust, TLP)"],
      m:"The W&M maintenance model has five areas. External monitoring watches CERTs, police and military intelligence, partners and vendor advisories for early warning. Internal monitoring uses the SOC, SIEM, asset inventories and maturity checks. Planning and risk assessment keeps plans current with root-cause and socio-technical analysis. Vulnerability assessment and remediation finds and fixes weaknesses through scans, pen tests and patching, plus physical resilience such as power and an alternative office. Readiness and review checks strategy, policies and plans through internal control, management review, training and exercises. To build a culture over time I would make maintenance a fixed yearly routine with owners per area and reports to management, use a routine database so known events are handled consistently and new ones update it, involve staff by sharing results and celebrating improvements (appreciative inquiry), learn from incidents with root-cause analysis and double-loop learning, train and exercise regularly with top management, measure maturity yearly, and share threat information with CERTs and partners under TLP." },
    { t:"ch11", k:"essay", x:"E23-Q2",
      q:"How could you combine the system security maintenance model with incident response, and why is it important?",
      kp:["External monitoring → threat intelligence improves IR preparation and early warning","Internal monitoring → SOC/SIEM alerts are the IR detection phase","Planning and risk assessment ← lessons learned update risk and plans","Vulnerability assessment ← weaknesses exploited in incidents fixed everywhere","Readiness and review → IR plans tested in exercises and reviewed after incidents","Why: faster detection/response, no repeated incidents, plans match real threats, better resource use, learning organisation instead of silos"],

  ]

    { t:"l3", k:"case", x:"Exam 2021 Q3",

    { t:"l3", k:"mc",

    { t:"l3", k:"def",

    { t:"l3", k:"mc",

    { t:"l3", k:"calc",
      q:"A set has 50% attack and 50% normal records. What is its entropy H(S)?",
      o:["0","0.5","1","2"], a:2,
      e:"H = −(0.5·log₂0.5 + 0.5·log₂0.5) = 1, the maximum for two classes. All one class gives 0." },
    { t:"l3", k:"calc",
      q:"H(S) = 1. Splitting on spkts ≤ 5 gives two groups that each contain only one class. What is the information gain?",
      o:["0","1","0.5","2"], a:1,
      e:"IG = H(S) − Σ(|Sᵥ|/|S|)·H(Sᵥ) = 1 − (0.5·0 + 0.5·0) = 1. The feature separates the classes perfectly." },
    { t:"l3", k:"mc", x:"Exam 2021 Q3",
      q:"What does a high information gain tell you about a feature?",
      o:["It strongly reduces uncertainty about the class, so it is useful for the target", "It repeats information already in other features, so it is redundant", "It has a high variance, but tells nothing about the class", "It increases entropy, so it should be removed from the dataset"], a:0,
      e:"Information gain is used to rank features. Low IG features are candidates for removal, but always check what the feature means." },
    { t:"l3", k:"mc", x:"Exam 2021 Q3",
      q:"What is the difference between feature selection and feature extraction?",
      o:["They are the same","Selection creates new features; extraction removes rows","Extraction only works on labels","Selection keeps a subset of the original features; extraction creates new features (e.g. PCA components)"], a:3,
      e:"Selected features keep their meaning; extracted features are harder to interpret." },
    { t:"l3", k:"mc", x:"Exam 2021 Q1",
      q:"What is the curse of dimensionality?",

      e:"Adding more features is not always better. Feature selection and PCA help." },
    { t:"l3", k:"mc", x:"Exam 2021 Q3",
      q:"What does PCA do?",
      o:["It selects the features with highest information gain","It centres the data, uses the covariance matrix and creates new uncorrelated features (principal components) that capture the most variance","It removes duplicate rows","It labels the data"], a:1,
      e:"Steps: centre the data → covariance matrix → eigenvalues/eigenvectors → project the data. PC1 captures the most variance." },
    { t:"l3", k:"calc",
      q:"PCA gives eigenvalues λ₁ = 9 and λ₂ = 1. How much variance does PC1 explain?",
      o:["90%","10%","9%","50%"], a:0,
      e:"Explained variance = λ₁ / Σλ = 9 / (9 + 1) = 90%. One component may be enough." },
    { t:"l3", k:"mc",
      q:"In PCA, what do an eigenvector and its eigenvalue represent?",

      e:"They come from C u = λ u, solved with det(C − λI) = 0." },
    { t:"l3", k:"case", x:"Exam 2021 Q3",

    { n: "Hash verification", d: "Comparing digital fingerprints (e.g. SHA-256); matching hashes prove a copy is identical.", x: "Mock 2026 Q2d" },
    { n: "Chain of custody", d: "A record of who handled the evidence, when and how." }
  ]},
  { t: "l3", terms: [
    { n: "Relevant feature", d: "A feature that is useful for the problem you want to solve.", ex: "spkts (source packets) for spotting attacks." },
    { n: "Irrelevant feature", d: "A feature that tells nothing useful about the target.", ex: "record_id, just a row number.", x: "Exam 2021 Q3" },
    { n: "Redundant feature", d: "A feature that repeats information already in other features.", ex: "total_pkts = spkts + dpkts.", x: "Exam 2021 Q3" },
    { n: "Variance", d: "How spread out one feature is around its mean (average squared distance)." },
    { n: "Covariance", d: "Whether two features move together (+), opposite (−) or not at all; its size depends on the units." },
    { n: "Correlation (Pearson)", d: "Covariance scaled to between −1 and +1, so it is easy to compare." },
    { n: "Cosine similarity", d: "Similarity based on the angle between two vectors: 1 = same direction, 0 = unrelated." },
    { n: "Entropy", d: "How mixed the class labels are: a 50/50 split of two classes = 1, all the same = 0." },
    { n: "Information gain", d: "How much a feature reduces entropy when you split on it.", ex: "“Is it alive?” removes more doubt than “Is it purple?”", x: "Exam 2021 Q3" },
    { n: "Feature selection", d: "Keeping a subset of the original features and removing the rest.", x: "Exam 2021 Q3" },
    { n: "Feature extraction", d: "Creating new features from the original ones.", ex: "PCA.", x: "Exam 2021 Q3" },
    { n: "Curse of dimensionality", d: "With many features, data spreads out, distances lose meaning and much more data is needed.", x: "Exam 2021 Q1" },
    { n: "PCA", d: "Principal Component Analysis: creates new features (components) that capture the most variance.", x: "Exam 2021 Q3" },
    { n: "Principal component", d: "One of the new axes PCA creates; PC1 captures the most variance." },
    { n: "Eigenvalue", d: "How much variance lies along a principal direction (eigenvector)." },
    { n: "Explained variance", d: "The share of total variance a component keeps: λ / Σλ.", ex: "PC1 keeps 9 / 10 = 90%." }
  ]},
  { t: "l4", terms: [
    { n: "Feature space", d: "A space where each feature is an axis and every example is a dot." },
    { n: "Synthetic data", d: "Data you generate yourself, so you know the true pattern." },
    { n: "Polynomial curve fitting", d: "Fitting a curve y = w₀ + w₁x + w₂x² + … through data points." },
    { n: "Order (M)", d: "The highest power in a polynomial; a higher M gives a more flexible curve." },
    { n: "Error function", d: "A formula that scores how well the model fits; learning means minimising it." },
    { n: "RMS error", d: "Root-mean-square error: the square root of the mean squared error, in the original units." },
    { n: "Underfitting", d: "The model is too simple to capture the pattern: poor on both training and test data.", x: "May 2026 Q1, Exam 2021 Q1" },
    { n: "Overfitting", d: "The model is too complex and memorises noise: great on training data, poor on new data.", x: "May 2026 Q1, Exam 2021 Q1" },
    { n: "Regularisation", d: "Adding a penalty for large weights to the error function so the model stays simple.", x: "May 2026 Q1, Exam 2021 Q1" },
    { n: "Confusion matrix", d: "A table counting true positives, false negatives, false positives and true negatives." },
    { n: "Accuracy", d: "(TP + TN) / all: the share of all predictions that are correct." },
    { n: "Precision", d: "TP / (TP + FP): when the model says yes, how often it is right." },
    { n: "Recall (sensitivity)", d: "TP / (TP + FN): of all real positives, how many were found." },
    { n: "Specificity", d: "TN / (TN + FP): of all real negatives, how many were correctly left alone." },
    { n: "F1-score", d: "One number that balances precision and recall: 2·P·R / (P + R)." },
    { n: "Class imbalance", d: "One class is much rarer than the other, so accuracy can be misleading.", ex: "96% accuracy on cancer but only 30% of real cases found.", x: "Exam 2021 Q1" },
    { n: "k-fold cross-validation", d: "Split data into k parts; each part takes a turn as the test set." },
    { n: "ROC curve", d: "A plot of true positive rate against false positive rate at different thresholds." }
  ]},
  { t: "l5", terms: [
    { n: "Artificial neural network (ANN)", d: "A model made of many simple, connected units (neurons) that learn from data." },
    { n: "Net input", d: "The weighted sum of a neuron’s inputs: Σ wᵢxᵢ." },
    { n: "Weight (neuron)", d: "How important an input is; learning means adjusting these values." },
    { n: "Bias", d: "An extra constant that shifts a neuron’s output, so the line does not have to pass through the origin." },
    { n: "Activation function", d: "Turns the net input into the neuron’s output." },
    { n: "Sigmoid function", d: "An S-shaped curve that squeezes any number into the range 0–1." },
    { n: "Perceptron", d: "One artificial neuron with a threshold activation; it draws one straight line between classes." },
    { n: "Delta rule", d: "Weight update Δw = η · δ · x, where δ = target − output." },
    { n: "Linearly separable", d: "The classes can be split by one straight line." },
    { n: "XOR problem", d: "Output 1 when exactly one input is 1; not linearly separable, so one perceptron cannot learn it." },
    { n: "Multilayer perceptron (MLP)", d: "A network with an input layer, one or more hidden layers and an output layer." },
    { n: "Gradient", d: "The slope of the loss function: which way, and how steeply, the error increases.", x: "May 2026 Q2, Exam 2021 Q2" },
    { n: "Gradient descent", d: "Repeatedly changing the weights opposite to the gradient to reduce the error.", ex: "w = 3, slope 2, η = 0.1 → new w = 2.8.", x: "May 2026 Q2, Exam 2021 Q2" },
    { n: "Learning rate (η or μ)", d: "The size of each weight-update step: too small is slow, too large overshoots.", x: "May 2026 Q2" },
    { n: "Local minimum", d: "A low point of the error that is not the lowest overall; gradient descent can get stuck there.", x: "May 2026 Q2" },
    { n: "Backpropagation", d: "Computes the gradients by sending the error backwards from the output layer to the input layer." },
    { n: "Epoch", d: "One full pass through all the training examples." },
    { n: "Momentum", d: "Adds part of the previous weight change to the current one to move faster and smoother." }
  ]},
  { t: "l6", terms: [
    { n: "Symbolic learning", d: "Learning with rules and trees that humans can read.", x: "May 2026 Q3, Mock 2026 Q3a" },
    { n: "Statistical learning", d: "Learning numeric models that use probability to handle uncertainty.", x: "May 2026 Q3, Mock 2026 Q3a" },
    { n: "Decision tree", d: "A tree of questions about features that ends in a class label.", ex: "The game 20 Questions.", x: "Mock 2026 Q3c" },
    { n: "Pruning", d: "Removing unreliable, too-specific branches of a tree to prevent overfitting.", x: "Mock 2026 Q3c, Exam 2021 Q4" },
    { n: "Regression tree", d: "Like a decision tree, but the leaves hold numbers instead of classes.", x: "Exam 2021 Q4" },
    { n: "Association rules", d: "Patterns of the form “if A happens, B also happens”.", ex: "People who buy fish and chips also buy soda." },
    { n: "Support", d: "How often the items appear together in all transactions.", ex: "{bread, milk} in 3 of 10 baskets = 30%." },
    { n: "Confidence", d: "How reliable a rule is: support(A and B) / support(A)." },
    { n: "One-vs-all (OVA)", d: "Solving a multi-class problem with one binary classifier per class.", ex: "4 classes → 4 classifiers.", x: "Exam 2021 Q4" },
    { n: "One-vs-one", d: "Solving a multi-class problem with one binary classifier for every pair of classes.", ex: "4 classes → 6 classifiers.", x: "Exam 2021 Q4", chk: true },
    { n: "Linear discriminant function", d: "g(x) = wᵀx + w₀; g > 0 → class 1, g < 0 → class 2.", x: "May 2026 Q3" },
    { n: "Logistic regression", d: "Uses a sigmoid to output a probability between 0 and 1." },
    { n: "k-nearest neighbours (k-NN)", d: "Finds the k closest training points and takes a majority vote.", ex: "Neighbours attack, attack, normal → attack.", x: "Mock 2026 Q3b" },
    { n: "Lazy learning", d: "No model is built in advance; the work happens only when a new example arrives.", x: "Mock 2026 Q3b" },
    { n: "Support vector machine (SVM)", d: "Finds the boundary with the largest margin between the classes." },
    { n: "Support vectors", d: "The points closest to the SVM boundary; they alone decide where it goes." },
    { n: "Kernel", d: "A trick that lets an SVM draw curved boundaries by working in a higher-dimensional space." },
    { n: "Manhattan distance", d: "Distance along a grid: |x₁−x₂| + |y₁−y₂|.", ex: "How a taxi drives through city blocks." }
  ]},
  { t: "l7", terms: [
    { n: "Cluster", d: "A group of similar data objects." },
    { n: "Intra-cluster similarity", d: "How similar items inside a cluster are; it should be high." },
    { n: "Inter-cluster similarity", d: "How similar different clusters are; it should be low." },
    { n: "Euclidean distance", d: "Straight-line distance between two points (“as the crow flies”)." },
    { n: "Mahalanobis distance", d: "Distance that takes the data’s spread and direction into account." },
    { n: "Hamming distance", d: "The number of positions where two strings differ.", ex: "10110 vs 10011 → 2." },
    { n: "Partitioning clustering", d: "Splitting data into a fixed number (K) of groups at once." },
    { n: "Hierarchical clustering", d: "Builds a tree of clusters, from small groups to big ones." },
    { n: "Dendrogram", d: "The tree diagram from hierarchical clustering; cutting it higher gives fewer clusters." },
    { n: "Agglomerative clustering", d: "Bottom-up: start with every point alone and repeatedly merge the two closest clusters." },
    { n: "Divisive clustering", d: "Top-down: start with one big cluster and split it repeatedly." },
    { n: "Hard clustering", d: "Each point belongs to exactly one cluster." },
    { n: "Soft clustering", d: "A point can belong to several clusters to some degree." },
    { n: "K-means", d: "Choose K centres, assign each point to the nearest centre, move each centre to the mean, and repeat." },
    { n: "Centroid", d: "The centre (mean) of a cluster." },
    { n: "Canopy clustering", d: "A fast, rough first pass that makes overlapping groups with a cheap distance before K-means." },
    { n: "Gaussian Mixture Model (GMM)", d: "Soft, probability-based clustering that assumes each cluster is a bell-shaped curve." }
  ]},
  { t: "srch", terms: [
    { n: "Exhaustive search", d: "Checks every possible solution; guaranteed to find the best but often far too slow.", x: "May 2026 Q4" },
    { n: "Heuristic search", d: "Uses rules of thumb to find a good solution fast, without a guarantee of the best.", ex: "Greedy feature selection.", x: "May 2026 Q4" },
    { n: "Search space", d: "All possible solutions to a problem.", ex: "2¹⁰⁰⁰ possible subsets of 1,000 features.", x: "May 2026 Q4" },
    { n: "Genetic algorithm (GA)", d: "A heuristic search that evolves a population of solutions with selection, crossover and mutation, without needing a gradient.", x: "Exam 2021 Q2" },
    { n: "Chromosome", d: "One candidate solution in a GA, often written as a bit string.", ex: "10110010." },
    { n: "Fitness function", d: "Scores how good each chromosome is.", ex: "f(x) = number of 1s.", x: "May 2026 Q5a" },
    { n: "Roulette-wheel selection", d: "Parents are picked with probability fᵢ / Σf, so fitter chromosomes are picked more often.", x: "May 2026 Q5b" },
    { n: "Single-point crossover", d: "Two parents swap their bits after one cut point to make two children.", ex: "1011|0010 + 1110|0001 → 10110001 and 11100010.", x: "May 2026 Q5c" },
    { n: "Mutation", d: "Randomly flipping bits to keep diversity in the population and help escape local optima.", x: "May 2026 Q5d" },
    { n: "Elitism", d: "Copying the best chromosomes unchanged into the next generation so good solutions are not lost.", x: "Exam 2021 Q2", chk: true }
