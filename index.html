<!-- =====================================================================
     APP LOGIC (design + behaviour). No course content below this line.
     ===================================================================== -->
<script>
(function(){
  "use strict";
  const STORE_KEY = "skoleExam.v1";
  const TYPE_LABEL = { mc:"Multiple choice", def:"Definition", case:"Scenario", tf:"True / false", essay:"Essay" };
  const app = document.getElementById("app");

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  function hash(str){ let h = 5381; for (let i=0;i<str.length;i++) h = ((h<<5)+h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
  function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  const slug = code => code.toLowerCase();

  // give every question a stable id + course reference
  COURSES.forEach(c => (c.questions||[]).forEach(q => { q.id = c.code + "-" + q.t + "-" + hash(q.q); q.course = c.code; }));
  const courseBy = code => COURSES.find(c => slug(c.code) === slug(code));
  const topicOf = (c, id) => c.topics.find(t => t.id === id);

  /* ---------- storage (per browser) ---------- */
  let store = { ans:{}, miss:{}, shuffle:true };
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch(e){}
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }
  function record(q, correct){
    const prev = store.ans[q.id] || { n:0 };
    store.ans[q.id] = { c: correct ? 1 : 0, n: prev.n + 1 };
    const list = store.miss[q.course] || (store.miss[q.course] = []);
    const i = list.indexOf(q.id);
    if (!correct && i < 0) list.push(q.id);
    if (correct && i >= 0) list.splice(i, 1);
    save();
  }
  function stats(qs){
    let answered=0, correct=0;
    qs.forEach(q => { const a = store.ans[q.id]; if (a){ answered++; if (a.c) correct++; } });
    return { total: qs.length, answered, correct };
  }
  function mistakes(c){ const ids = store.miss[c.code] || []; return c.questions.filter(q => ids.includes(q.id)); }

  /* ---------- dates ---------- */
  function daysLeft(iso){
    const [y,m,d] = iso.split("-").map(Number);
    const exam = new Date(y, m-1, d); const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((exam - today) / 86400000);
  }
  function fmtDate(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-GB",{ weekday:"short", day:"numeric", month:"short", year:"numeric" }); }
  function countdown(iso){
    const n = daysLeft(iso);
    if (n > 1) return `<div class="countdown"><b>${n}</b><span class="muted">days left</span></div>`;
    if (n === 1) return `<div class="countdown"><b>1</b><span class="muted">day left</span></div>`;
    if (n === 0) return `<div class="countdown"><b>Today</b></div>`;
    return `<div class="countdown"><span class="muted">Exam was ${-n} days ago</span></div>`;
  }

  /* ---------- shared pieces ---------- */
  function bar(s){
    const ok = s.total ? s.correct/s.total*100 : 0, bad = s.total ? (s.answered-s.correct)/s.total*100 : 0;
    return `<div class="bar" role="img" aria-label="${s.correct} correct, ${s.answered-s.correct} wrong, of ${s.total}"><i class="ok" style="width:${ok}%"></i><i class="bad" style="width:${bad}%"></i></div>`;
  }
  function statLine(s){
    const pct = s.answered ? Math.round(s.correct/s.answered*100) : 0;
    return `<p class="stat">${s.answered}/${s.total} answered${s.answered ? ` · ${pct}% correct last time` : ""}</p>`;
  }
  function nav(crumbs, backTo){
    const parts = crumbs.map((c,i) => i < crumbs.length-1 ? `<a href="#${c.h}">${esc(c.label)}</a><span class="sep">›</span>` : `<span aria-current="page">${esc(c.label)}</span>`).join("");
    const back = backTo === null ? "" : `<button class="back" data-go="${backTo}" aria-label="Back">← Back</button>`;
    return `<div class="topbar">${back}<nav class="crumbs" aria-label="Breadcrumb">${parts}</nav></div>`;
  }
  function setTheme(color){ app.className = color ? "c-" + color : "c-teal"; document.body.className = app.className; }

  /* ---------- state ---------- */
  let session = null;     // active quiz / flashcard round
  let confirmReset = false;

  function go(h){ if (location.hash === "#" + h || (!h && !location.hash)) { session = null; render(); } else location.hash = h; }
  window.addEventListener("hashchange", () => { session = null; confirmReset = false; render(); });

  /* ---------- HOME ---------- */
  function renderHome(){
    setTheme("teal");
    const active = COURSES.filter(c => c.status !== "soon").sort((a,b) => a.exam.localeCompare(b.exam));
    const next = active.find(c => daysLeft(c.exam) >= 0);
    const cards = COURSES.map(c => {
      if (c.status === "soon") return `<div class="card course-card soon c-${c.color||"slate"}"><span class="code">${esc(c.code)}</span><h3>${esc(c.name)}</h3><span class="pill ghost">Coming soon</span><p class="note">Questions will be added from a separate chat.</p></div>`;
      const s = stats(c.questions);
      return `<button class="card course-card c-${c.color}" data-go="${slug(c.code)}">
        <span class="code">${esc(c.code)}</span><h3>${esc(c.name)}</h3>
        <p class="stat">Exam ${esc(fmtDate(c.exam))}</p>${countdown(c.exam)}${bar(s)}${statLine(s)}</button>`;
    }).join("");
    const total = active.reduce((n,c)=>n+c.questions.length,0);
    app.innerHTML = `
      ${nav([{label:"Home",h:""}], null)}
      <header class="hero"><span class="eyebrow">Information Security · NTNU · Autumn 2026</span>
        <h1>Skole Exam Trainer</h1>
        <p class="muted">${total} questions from former exams, slides and notes. ${next ? `Next up: <b>${esc(next.code)}</b> on ${esc(fmtDate(next.exam))}.` : ""}</p></header>
      <section class="grid">${cards}</section>
      <footer>Progress is saved in this browser only. ⭐ = based on a former exam question.</footer>`;
  }

  /* ---------- COURSE ---------- */
  function modeBlock(title, desc, qs, scope){
    const n = qs.length;
    return `<div class="mode"><h3>${esc(title)}</h3><p class="note">${esc(desc)} · ${n} question${n===1?"":"s"}</p>
      <div class="btnrow"><button class="btn" data-start="quiz" data-scope="${scope}" ${n?"":"disabled"}>Quiz</button>
      <button class="btn alt" data-start="flash" data-scope="${scope}" ${n?"":"disabled"}>Flashcards</button></div></div>`;
  }
  function shuffleToggle(){ return `<label class="toggle"><input type="checkbox" id="shuffle-toggle" ${store.shuffle?"checked":""}> Shuffle questions</label>`; }

  function renderCourse(c){
    setTheme(c.color);
    const s = stats(c.questions);
    const examQs = c.questions.filter(q => q.x), miss = mistakes(c);
    const topics = c.topics.map((t,i) => {
      const qs = c.questions.filter(q => q.t === t.id), ts = stats(qs), stars = qs.filter(q=>q.x).length;
      return `<button class="card topic-card" data-go="${slug(c.code)}-${t.id}">
        <span class="num">Lecture ${i+1}</span><h3>${esc(t.title)}</h3><span class="file">Slides: ${esc(t.file)}</span>
        <div class="btnrow"><span class="pill">${qs.length} questions</span>${stars?`<span class="pill star">⭐ ${stars} from exams</span>`:""}</div>
        ${bar(ts)}${statLine(ts)}</button>`;
    }).join("");
    app.innerHTML = `
      ${nav([{label:"Home",h:""},{label:c.code,h:slug(c.code)}], "")}
      <header class="hero"><span class="eyebrow">${esc(c.code)} · ${esc(c.examInfo)}</span><h1>${esc(c.name)}</h1>
        <p class="muted">Exam ${esc(fmtDate(c.exam))}</p>${countdown(c.exam)}${bar(s)}${statLine(s)}</header>
      <section class="modes">
        ${modeBlock("All topics","Everything in this course", c.questions, "all")}
        ${modeBlock("Former exam questions only","Questions marked ⭐", examQs, "exam")}
        ${modeBlock("Practice my mistakes","Questions you got wrong last time", miss, "miss")}
      </section>
      ${shuffleToggle()}
      <h2>Topics</h2><section class="grid">${topics}</section>
      <div class="confirm">${confirmReset
        ? `<span>Delete all saved answers and mistakes for ${esc(c.code)}?</span><button class="btn" data-reset="yes">Yes, reset</button><button class="btn alt" data-reset="no">Cancel</button>`
        : `<button class="btn alt" data-reset="ask">Reset progress for ${esc(c.code)}</button>`}</div>`;
  }

  /* ---------- TOPIC ---------- */
  function renderTopic(c, t){
    setTheme(c.color);
    const qs = c.questions.filter(q => q.t === t.id), s = stats(qs);
    const examQs = qs.filter(q=>q.x), miss = mistakes(c).filter(q=>q.t===t.id);
    const idx = c.topics.indexOf(t);
    const kinds = Object.entries(qs.reduce((m,q)=>{ m[q.k]=(m[q.k]||0)+1; return m; },{})).map(([k,n])=>`<span class="pill ghost">${n} ${TYPE_LABEL[k].toLowerCase()}</span>`).join("");
    app.innerHTML = `
      ${nav([{label:"Home",h:""},{label:c.code,h:slug(c.code)},{label:t.title,h:slug(c.code)+"-"+t.id}], slug(c.code))}
      <header class="hero"><span class="eyebrow">${esc(c.code)} · Lecture ${idx+1}</span><h1>${esc(t.title)}</h1>
        <p class="muted">Slides: ${esc(t.file)}</p><div class="btnrow">${kinds}</div>${bar(s)}${statLine(s)}</header>
      <section class="modes">
        ${modeBlock("Whole topic","All questions in this topic", qs, "topic")}
        ${modeBlock("Former exam questions","Only ⭐ questions in this topic", examQs, "topicexam")}
        ${modeBlock("My mistakes in this topic","Wrong last time", miss, "topicmiss")}
      </section>
      ${shuffleToggle()}`;
    app.dataset.topic = t.id;
  }

  /* ---------- SESSION start ---------- */
  function startSession(c, t, mode, scope){
    let qs, label;
    if (scope === "all"){ qs = c.questions; label = "All topics"; }
    else if (scope === "exam"){ qs = c.questions.filter(q=>q.x); label = "Former exam questions"; }
    else if (scope === "miss"){ qs = mistakes(c); label = "My mistakes"; }
    else if (scope === "topic"){ qs = c.questions.filter(q=>q.t===t.id); label = t.title; }
    else if (scope === "topicexam"){ qs = c.questions.filter(q=>q.t===t.id && q.x); label = t.title + " · exam"; }
    else { qs = mistakes(c).filter(q=>q.t===t.id); label = t.title + " · mistakes"; }
    if (!qs.length) return;
    const list = store.shuffle ? shuffle(qs) : qs.slice();
    session = { code:c.code, topic: t ? t.id : null, mode, scope, label, list, i:0, results:[], done:false };
    prepQuestion(); render(); window.scrollTo(0,0);
  }
  function prepQuestion(){
    const q = session.list[session.i];
    session.answered = false; session.chosen = null; session.flipped = false; session.revealed = false; session.draft = "";
    if (!q || !q.o) { session.order = []; return; }
    const idx = q.o.map((_,i)=>i);
    const fixed = q.k === "tf" || q.o.some(o => /of the above|other options/i.test(o));
    session.order = (store.shuffle && !fixed) ? shuffle(idx) : idx;
  }

  /* ---------- QUIZ / FLASH render ---------- */
  function qMeta(c, q){
    const t = topicOf(c, q.t);
    return `<div class="qmeta"><span class="pill">${esc(t ? t.title : q.t)}</span><span class="pill ghost">${TYPE_LABEL[q.k]}</span>
      ${q.x ? `<span class="pill star">⭐ ${esc(q.x)}</span>` : ""}${q.chk ? `<span class="pill chk">Needs checking</span>` : ""}</div>`;
  }
  function sessionNav(c){
    const crumbs = [{label:"Home",h:""},{label:c.code,h:slug(c.code)}];
    if (session.topic){ const t = topicOf(c, session.topic); crumbs.push({label:t.title,h:slug(c.code)+"-"+t.id}); }
    crumbs.push({label: session.mode === "quiz" ? "Quiz" : "Flashcards", h: location.hash.slice(1)});
    return nav(crumbs, location.hash.slice(1) || "");
  }
  function progress(){
    const n = session.list.length, i = Math.min(session.i+1, n);
    return `<div class="progress"><span>${esc(session.label)}</span><div class="bar"><i style="width:${(session.i)/n*100}%"></i></div><span>${i}/${n}</span></div>`;
  }

  function renderQuiz(c){
    const q = session.list[session.i];
    let body = "";
    if (q.k === "essay"){
      body = `<label class="note" for="essay-draft">Write your key points (optional, not saved):</label>
        <textarea id="essay-draft" placeholder="Outline your answer here…">${esc(session.draft)}</textarea>`;
      if (!session.revealed) body += `<div class="btnrow"><button class="btn" data-act="reveal">Show model answer</button></div>`;
      else {
        body += `<div class="feedback neutral"><strong>Key points to include</strong><ul class="kp">${q.kp.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
          <div class="model"><strong>Model answer</strong><p>${esc(q.m)}</p></div>`;
        body += session.answered ? `<div class="btnrow"><button class="btn" data-act="next">${session.i+1 < session.list.length ? "Next question →" : "See score"}</button></div>`
          : `<p class="note">Compare with your outline. Did you cover the key points?</p><div class="btnrow"><button class="btn" data-self="1">I covered them</button><button class="btn alt" data-self="0">I missed some</button></div>`;
      }
    } else {
      const opts = session.order.map((oi, pos) => {
        let cls = "opt";
        if (session.answered){ if (oi === q.a) cls += " right"; else if (oi === session.chosen) cls += " wrong"; }
        return `<button class="${cls}" data-opt="${oi}" ${session.answered?"disabled":""}><span class="key">${pos+1}</span><span>${esc(q.o[oi])}</span></button>`;
      }).join("");
      body = `<div class="opts" role="group" aria-label="Answer options">${opts}</div>`;
      if (session.answered){
        const ok = session.chosen === q.a;
        body += `<div class="feedback ${ok?"ok":"bad"}"><strong>${ok?"Correct":"Not quite"}</strong>
          ${ok?"":`<p>Correct answer: <b>${esc(q.o[q.a])}</b></p>`}<p>${esc(q.e)}</p>
          ${q.chk?`<p class="note">This answer is marked “Needs checking”: confirm it with the slides or lecturer.</p>`:""}</div>
          <div class="btnrow"><button class="btn" data-act="next">${session.i+1 < session.list.length ? "Next question →" : "See score"}</button></div>`;
      } else body += `<p class="note">Tip: press 1–${q.o.length} on a keyboard.</p>`;
    }
    app.innerHTML = `${sessionNav(c)}${progress()}<article class="qcard">${qMeta(c,q)}<p class="qtext">${esc(q.q)}</p>${body}</article>`;
  }

  function renderFlash(c){
    const q = session.list[session.i];
    let back = "";
    if (q.k === "essay") back = `<strong>Key points</strong><ul class="kp">${q.kp.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`;
    else back = `<p class="qtext">${esc(q.o[q.a])}</p><p class="muted">${esc(q.e)}</p>`;
    const card = session.flipped
      ? `<button class="qcard flash" data-act="flip" aria-label="Show question"><span class="side">Answer</span>${back}</button>`
      : `<button class="qcard flash" data-act="flip" aria-label="Show answer"><span class="side">Question · tap to flip</span>${qMeta(c,q)}<p class="qtext">${esc(q.q)}</p></button>`;
    const actions = session.flipped
      ? `<div class="btnrow"><button class="btn" data-know="1">I knew it</button><button class="btn alt" data-know="0">I didn't know</button></div>`
      : `<div class="btnrow"><button class="btn" data-act="flip">Show answer</button>${session.i>0?`<button class="btn alt" data-act="prev">← Previous</button>`:""}</div>`;
    app.innerHTML = `${sessionNav(c)}${progress()}${card}${actions}`;
  }

  function renderResult(c){
    const n = session.results.length, ok = session.results.filter(r=>r.ok).length;
    const wrong = session.results.filter(r=>!r.ok);
    const pct = n ? Math.round(ok/n*100) : 0;
    const verdict = pct >= 90 ? "Excellent. You are exam-ready on this set." : pct >= 70 ? "Good. Review the ones you missed." : pct >= 50 ? "Getting there. Practise your mistakes next." : "Keep going. Use flashcards, then quiz again.";
    const list = wrong.length ? wrong.map(r => {
      const q = r.q, t = topicOf(c,q.t);
      const ans = q.k === "essay" ? "See key points in the model answer" : q.o[q.a];
      return `<div class="rev"><span class="note">${esc(t?t.title:"")}${q.x?` · ⭐ ${esc(q.x)}`:""}</span><span>${esc(q.q)}</span><span class="ans">${esc(ans)}</span></div>`;
    }).join("") : `<div class="empty">No mistakes this round.</div>`;
    const missCount = mistakes(c).length;
    app.innerHTML = `${sessionNav(c)}
      <section class="card"><span class="eyebrow">${esc(session.label)} · ${session.mode==="quiz"?"Quiz":"Flashcards"} finished</span>
        <div class="countdown"><span class="score">${ok}/${n}</span><span class="muted">${pct}%</span></div><p>${verdict}</p>
        <div class="btnrow"><button class="btn" data-act="again">Try this set again</button>
        <button class="btn alt" data-start="${session.mode}" data-scope="miss" ${missCount?"":"disabled"}>Practice my mistakes (${missCount})</button>
        <button class="btn alt" data-go="${location.hash.slice(1)}">Done</button></div></section>
      <h2>Review: answers you missed</h2><div class="list">${list}</div>`;
  }

  /* ---------- router ---------- */
  function render(){
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (!h){ renderHome(); return; }
    const [code, topicId] = h.split(/-(.+)/);
    const c = courseBy(code);
    if (!c || c.status === "soon"){ renderHome(); return; }
    if (session && session.code === c.code){
      if (session.done) return renderResult(c);
      return session.mode === "quiz" ? renderQuiz(c) : renderFlash(c);
    }
    const t = topicId ? topicOf(c, topicId) : null;
    if (topicId && !t) return renderCourse(c);
    t ? renderTopic(c, t) : renderCourse(c);
  }

  function currentCourse(){ const h = location.hash.slice(1).toLowerCase(); const [code, tid] = h.split(/-(.+)/); const c = courseBy(code); return { c, t: c && tid ? topicOf(c, tid) : null }; }
  function advance(){
    session.i++;
    if (session.i >= session.list.length){ session.done = true; }
    else prepQuestion();
    render(); window.scrollTo(0,0);
  }
  function answer(oi){
    const q = session.list[session.i]; if (session.answered) return;
    session.answered = true; session.chosen = oi;
    const ok = oi === q.a; record(q, ok); session.results.push({ q, ok }); render();
  }

  /* ---------- events ---------- */
  app.addEventListener("click", e => {
    const el = e.target.closest("button, a"); if (!el) return;
    const d = el.dataset;
    if (d.go !== undefined){ e.preventDefault(); go(d.go); return; }
    const { c, t } = currentCourse();
    if (d.start){
      // from a result screen, "miss" means mistakes in the same scope (topic or course)
      let scope = d.scope;
      if (session && session.topic && scope === "miss") scope = "topicmiss";
      session = null; startSession(c, t, d.start, scope); return;
    }
    if (d.reset){ if (d.reset === "ask") confirmReset = true; else { if (d.reset === "yes"){ c.questions.forEach(q => delete store.ans[q.id]); delete store.miss[c.code]; save(); } confirmReset = false; } render(); return; }
    if (!session) return;
    if (d.opt !== undefined){ answer(Number(d.opt)); return; }
    if (d.act === "next"){ advance(); return; }
    if (d.act === "reveal"){ const ta = document.getElementById("essay-draft"); if (ta) session.draft = ta.value; session.revealed = true; render(); return; }
    if (d.self !== undefined){ const ta = document.getElementById("essay-draft"); if (ta) session.draft = ta.value;
      const q = session.list[session.i], ok = d.self === "1"; record(q, ok); session.results.push({ q, ok }); session.answered = true; render(); return; }
    if (d.act === "flip"){ session.flipped = !session.flipped; render(); return; }
    if (d.act === "prev"){ if (session.i > 0){ session.i--; session.results.pop(); prepQuestion(); render(); } return; }
    if (d.know !== undefined){ const q = session.list[session.i], ok = d.know === "1"; record(q, ok); session.results.push({ q, ok }); advance(); return; }
    if (d.act === "again"){ const list = store.shuffle ? shuffle(session.list) : session.list; Object.assign(session, { list, i:0, results:[], done:false }); prepQuestion(); render(); window.scrollTo(0,0); return; }
  });
  app.addEventListener("change", e => { if (e.target.id === "shuffle-toggle"){ store.shuffle = e.target.checked; save(); } });
  app.addEventListener("input", e => { if (e.target.id === "essay-draft" && session) session.draft = e.target.value; });
  document.addEventListener("keydown", e => {
    if (!session || session.done || session.mode !== "quiz" || e.target.tagName === "TEXTAREA") return;
    const q = session.list[session.i];
    if (!session.answered && q.o && /^[1-9]$/.test(e.key)){ const pos = Number(e.key)-1; if (pos < session.order.length) answer(session.order[pos]); }
    else if (session.answered && e.key === "Enter"){ e.preventDefault(); advance(); }
  });

  render();
})();
</script>
</body>
</html>
